<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factoidal — W3C Test Progress</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    max-width: 960px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #fafafa;
    color: #1a1a1a;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .subtitle { color: #666; margin-bottom: 2rem; }
  canvas { display: block; margin: 0 auto; }
  .chart-container {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }
  th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid #eee; }
  th { font-weight: 600; color: #555; }
  .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; }
  .bar { display: inline-block; height: 14px; border-radius: 2px; vertical-align: middle; }
  .bar-nt { background: #22c55e; }
  .bar-turtle { background: #3b82f6; }
  .bar-sparql { background: #f59e0b; }
  .legend { display: flex; gap: 1.5rem; margin-bottom: 1rem; font-size: 0.875rem; }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 2px; }
  .suite-table { margin-top: 0.5rem; }
  .suite-table th { font-size: 0.8rem; }
  .suite-table td { font-size: 0.8rem; padding: 0.35rem 0.75rem; }
  .bar-pass { background: #22c55e; }
  .bar-fail { background: #ef4444; }
  .bar-stack { display: inline-flex; height: 14px; border-radius: 2px; overflow: hidden; vertical-align: middle; }
  .pct-100 { color: #22c55e; font-weight: 600; }
  .pct-0 { color: #ef4444; font-weight: 600; }
  .section-header { display: flex; align-items: center; gap: 0.5rem; margin-top: 1.5rem; margin-bottom: 0.5rem; }
  .section-header h3 { font-size: 1rem; margin: 0; }
  .section-badge { font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 10px; font-weight: 600; }
</style>
</head>
<body>
<h1>Factoidal — W3C Test Progress</h1>
<p class="subtitle">Formally verified RDF toolkit test coverage over time</p>

<div class="chart-container">
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:#22c55e"></div> N-Triples (72/72)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#3b82f6"></div> Turtle (223/223)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#f59e0b"></div> SPARQL (159/436, 277 failing)</div>
  </div>
  <canvas id="chart" width="900" height="400"></canvas>
</div>

<h2 style="font-size:1.2rem">Commit History</h2>
<table>
  <thead>
    <tr><th>Time</th><th>Commit</th><th>N-Triples</th><th>Turtle</th><th>SPARQL</th><th>Milestone</th></tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<div id="suiteBreakdown"></div>

<script>
const data = [
  { time: "Mar 5 17:12", hash: "bcf7aef", nt: 0, turtle: 0, sparql: 0, total_sparql: 0, label: "Initial commit" },
  { time: "Mar 5 22:36", hash: "43d7603", nt: 72, turtle: 0, sparql: 0, total_sparql: 0, label: "N-Triples 72/72" },
  { time: "Mar 5 23:11", hash: "a5496c1", nt: 72, turtle: 223, sparql: 0, total_sparql: 0, label: "Turtle 223/223" },
  { time: "Mar 5 23:39", hash: "5a36f95", nt: 72, turtle: 223, sparql: 32, total_sparql: 436, label: "SPARQL harness (32 suites)" },
  { time: "Mar 6 00:05", hash: "2f0cb65", nt: 72, turtle: 223, sparql: 93, total_sparql: 436, label: "Literals, UNION, FILTER (+61)" },
  { time: "Mar 6 00:58", hash: "4a201fc", nt: 72, turtle: 223, sparql: 115, total_sparql: 436, label: "OPTIONAL, EXISTS (+22)" },
  { time: "Mar 6 01:22", hash: "5d885bf", nt: 72, turtle: 223, sparql: 122, total_sparql: 436, label: "Expression fixes (+7)" },
  { time: "Mar 6 01:27", hash: "6b9eddf", nt: 72, turtle: 223, sparql: 141, total_sparql: 436, label: "SELECT expr, BIND (+19)" },
  { time: "Mar 6 01:50", hash: "8300bb1", nt: 72, turtle: 223, sparql: 159, total_sparql: 436, label: "Hash, date/time, STRDT (+18)" },
  { time: "Mar 6 02:30", hash: "036f12d", nt: 72, turtle: 223, sparql: 159, total_sparql: 436, label: "ASK query form" },
];

// Draw chart
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const PAD = { top: 20, right: 30, bottom: 60, left: 50 };
const plotW = W - PAD.left - PAD.right;
const plotH = H - PAD.top - PAD.bottom;

const maxY = 460; // slightly above max total
const n = data.length;

function x(i) { return PAD.left + (i / (n - 1)) * plotW; }
function y(v) { return PAD.top + plotH - (v / maxY) * plotH; }

// Grid
ctx.strokeStyle = '#eee';
ctx.lineWidth = 1;
for (let v = 0; v <= maxY; v += 50) {
  ctx.beginPath();
  ctx.moveTo(PAD.left, y(v));
  ctx.lineTo(W - PAD.right, y(v));
  ctx.stroke();
  ctx.fillStyle = '#999';
  ctx.font = '11px system-ui';
  ctx.textAlign = 'right';
  ctx.fillText(v, PAD.left - 8, y(v) + 4);
}

// Draw stacked area: SPARQL (bottom), Turtle (middle), N-Triples (top)
function drawArea(getData, color, alpha) {
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(x(0), y(0));
  for (let i = 0; i < n; i++) ctx.lineTo(x(i), y(getData(i)));
  ctx.lineTo(x(n-1), y(0));
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawLine(getData, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    if (i === 0) ctx.moveTo(x(i), y(getData(i)));
    else ctx.lineTo(x(i), y(getData(i)));
  }
  ctx.stroke();
}

// Stacked: total = sparql + turtle + nt
const totalAt = i => data[i].sparql + data[i].turtle + data[i].nt;
const turtleSparqlAt = i => data[i].sparql + data[i].turtle;
const sparqlAt = i => data[i].sparql;

// Areas (bottom to top)
drawArea(totalAt, '#22c55e', 0.25);
drawArea(turtleSparqlAt, '#3b82f6', 0.25);
drawArea(sparqlAt, '#f59e0b', 0.25);

// Lines
drawLine(totalAt, '#22c55e', 2.5);
drawLine(turtleSparqlAt, '#3b82f6', 2.5);
drawLine(sparqlAt, '#f59e0b', 2.5);

// Dots
for (let i = 0; i < n; i++) {
  [[totalAt(i), '#22c55e'], [turtleSparqlAt(i), '#3b82f6'], [sparqlAt(i), '#f59e0b']].forEach(([val, col]) => {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(x(i), y(val), 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });
}

// X labels
ctx.fillStyle = '#666';
ctx.font = '10px system-ui';
ctx.textAlign = 'center';
for (let i = 0; i < n; i++) {
  ctx.save();
  ctx.translate(x(i), H - PAD.bottom + 12);
  ctx.rotate(-Math.PI / 4);
  ctx.textAlign = 'right';
  ctx.fillText(data[i].time, 0, 0);
  ctx.restore();
}

// Y axis label
ctx.save();
ctx.translate(14, PAD.top + plotH / 2);
ctx.rotate(-Math.PI / 2);
ctx.textAlign = 'center';
ctx.fillStyle = '#666';
ctx.font = '12px system-ui';
ctx.fillText('W3C Tests Passing', 0, 0);
ctx.restore();

// Current totals annotation
ctx.fillStyle = '#333';
ctx.font = 'bold 12px system-ui';
ctx.textAlign = 'left';
const lastI = n - 1;
ctx.fillStyle = '#f59e0b';
ctx.fillText(`${data[lastI].sparql}/436`, x(lastI) + 8, y(sparqlAt(lastI)) + 4);
ctx.fillStyle = '#3b82f6';
ctx.fillText(`+223`, x(lastI) + 8, y(turtleSparqlAt(lastI)) + 4);
ctx.fillStyle = '#22c55e';
ctx.fillText(`+72`, x(lastI) + 8, y(totalAt(lastI)) + 4);

// Table
const tbody = document.getElementById('tableBody');
data.forEach(d => {
  const tr = document.createElement('tr');
  const sparqlPct = d.total_sparql > 0 ? ` (${(100*d.sparql/d.total_sparql).toFixed(1)}%)` : '';
  tr.innerHTML = `
    <td class="mono">${d.time}</td>
    <td class="mono">${d.hash}</td>
    <td>${d.nt}/72 <span class="bar bar-nt" style="width:${d.nt/72*60}px"></span></td>
    <td>${d.turtle}/223 <span class="bar bar-turtle" style="width:${d.turtle/223*60}px"></span></td>
    <td>${d.sparql}${d.total_sparql ? '/'+d.total_sparql : ''}${sparqlPct} <span class="bar bar-sparql" style="width:${d.total_sparql ? d.sparql/d.total_sparql*60 : 0}px"></span></td>
    <td>${d.label}</td>`;
  tbody.appendChild(tr);
});

// SPARQL suite breakdown tables
const sparql10 = [
  { suite: "algebra", pass: 5, total: 14, blocker: "GRAPH keyword, nested scope" },
  { suite: "basic", pass: 20, total: 27, blocker: "BASE resolution, list patterns" },
  { suite: "bnode-coreference", pass: 1, total: 1, blocker: "-" },
  { suite: "boolean-eff-value", pass: 5, total: 7, blocker: "Typed literal BEV" },
  { suite: "bound", pass: 1, total: 1, blocker: "-" },
  { suite: "cast", pass: 0, total: 7, blocker: "Casting functions" },
  { suite: "distinct", pass: 7, total: 11, blocker: "Numeric value comparison" },
  { suite: "expr-builtin", pass: 9, total: 24, blocker: "Complex expression parsing" },
  { suite: "expr-equals", pass: 9, total: 15, blocker: "Cross-graph equality" },
  { suite: "expr-ops", pass: 9, total: 17, blocker: "Division, type promotion" },
  { suite: "i18n", pass: 2, total: 5, blocker: "Unicode normalization" },
  { suite: "open-world", pass: 7, total: 18, blocker: "UNION scope, complex filters" },
  { suite: "optional", pass: 1, total: 7, blocker: "OPTIONAL result ordering" },
  { suite: "optional-filter", pass: 1, total: 6, blocker: "FILTER inside OPTIONAL" },
  { suite: "reduced", pass: 2, total: 2, blocker: "-" },
  { suite: "regex", pass: 14, total: 21, blocker: "Quantifier edge cases" },
  { suite: "solution-seq", pass: 11, total: 13, blocker: "OFFSET edge cases" },
  { suite: "sort", pass: 4, total: 4, blocker: "-" },
  { suite: "triple-match", pass: 2, total: 4, blocker: "Named graph matching" },
  { suite: "type-promotion", pass: 0, total: 30, blocker: "Numeric type promotion" },
];

const sparql11 = [
  { suite: "aggregates", pass: 0, total: 35, blocker: "COUNT, SUM, AVG, GROUP BY, HAVING" },
  { suite: "bind", pass: 3, total: 10, blocker: "Complex BIND expressions" },
  { suite: "bindings", pass: 1, total: 11, blocker: "VALUES clause" },
  { suite: "cast", pass: 0, total: 6, blocker: "Casting functions" },
  { suite: "exists", pass: 3, total: 6, blocker: "Complex EXISTS patterns" },
  { suite: "functions", pass: 31, total: 74, blocker: "Remaining 1.1 built-in functions" },
  { suite: "grouping", pass: 2, total: 4, blocker: "Complex GROUP BY expressions" },
  { suite: "negation", pass: 2, total: 11, blocker: "MINUS, complex NOT EXISTS" },
  { suite: "project-expression", pass: 7, total: 7, blocker: "-" },
  { suite: "property-path", pass: 0, total: 29, blocker: "Property path operators" },
  { suite: "subquery", pass: 0, total: 9, blocker: "Sub-SELECT" },
];

function buildSuiteTable(suites, title, containerId) {
  const totalPass = suites.reduce((s, r) => s + r.pass, 0);
  const totalAll = suites.reduce((s, r) => s + r.total, 0);
  const totalFail = totalAll - totalPass;
  const pct = (100 * totalPass / totalAll).toFixed(1);

  let html = `<div class="section-header">
    <h3>${title}</h3>
    <span class="section-badge" style="background:#fef3c7;color:#92400e">${totalPass}/${totalAll} (${pct}%) — ${totalFail} failing</span>
  </div>
  <table class="suite-table">
    <thead><tr><th>Suite</th><th>Pass</th><th>Fail</th><th>Total</th><th>Rate</th><th></th><th>Key Blockers</th></tr></thead>
    <tbody>`;

  suites.forEach(r => {
    const fail = r.total - r.pass;
    const rate = (100 * r.pass / r.total).toFixed(1);
    const passW = Math.round(r.pass / r.total * 60);
    const failW = 60 - passW;
    const rateClass = rate === '100.0' ? ' class="pct-100"' : (rate === '0.0' ? ' class="pct-0"' : '');
    html += `<tr>
      <td>${r.suite}</td><td>${r.pass}</td><td>${fail}</td><td>${r.total}</td>
      <td${rateClass}>${rate}%</td>
      <td><div class="bar-stack" style="width:60px">${passW > 0 ? `<span class="bar-pass" style="width:${passW}px"></span>` : ''}${failW > 0 ? `<span class="bar-fail" style="width:${failW}px"></span>` : ''}</div></td>
      <td>${r.blocker}</td></tr>`;
  });

  html += '</tbody></table>';
  return html;
}

document.getElementById('suiteBreakdown').innerHTML =
  buildSuiteTable(sparql10, 'SPARQL 1.0 Suite Breakdown', 'sparql10') +
  buildSuiteTable(sparql11, 'SPARQL 1.1 Suite Breakdown', 'sparql11');
</script>
</body>
</html>
