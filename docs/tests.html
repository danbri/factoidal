<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RDF Core 1.1 — WASM Unit Tests</title>
<style>
  body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 1.5rem; }
  h1 { color: #38bdf8; font-size: 1.25rem; margin-bottom: 1rem; }
  .pass { color: #4ade80; } .fail { color: #f87171; }
  .suite { color: #94a3b8; margin-top: 1rem; margin-bottom: 0.25rem; font-weight: bold; }
  .result { margin-left: 1rem; font-size: 0.875rem; }
  #summary { margin-top: 1.5rem; font-size: 1rem; padding: 0.5rem;
             border: 1px solid #334155; border-radius: 0.375rem; }
</style>
</head>
<body>
<h1>RDF Core 1.1 — WASM Unit Tests</h1>
<div id="log"></div>
<div id="summary"></div>

<script type="module">
// =========================================================================
//  Load the real WASM library — testing the actual Rust implementation
// =========================================================================

import init, { JsRdfGraph } from './pkg/rdf_wasm.js';

await init();

// =========================================================================
//  Test runner
// =========================================================================

let passed = 0, failed = 0;
const log = document.getElementById("log");

function suite(name) {
  const el = document.createElement("div");
  el.className = "suite";
  el.textContent = name;
  log.appendChild(el);
}

function assert(condition, name) {
  const el = document.createElement("div");
  el.className = "result";
  if (condition) {
    passed++;
    el.innerHTML = `<span class="pass">PASS</span> ${name}`;
  } else {
    failed++;
    el.innerHTML = `<span class="fail">FAIL</span> ${name}`;
  }
  log.appendChild(el);
}

function assertThrows(fn, name) {
  let threw = false;
  try { fn(); } catch (_) { threw = true; }
  assert(threw, name);
}

// =========================================================================
//  Tests — all exercising the Rust/WASM library via JsRdfGraph
// =========================================================================

// -- IRI validation (tested through addTriple) --
suite("IRI validation");
{
  const g = new JsRdfGraph();
  assertThrows(() => g.addTriple("", "http://ex.org/p", "http://ex.org/o"), "rejects empty subject IRI");
  assertThrows(() => g.addTriple("noscheme", "http://ex.org/p", "http://ex.org/o"), "rejects subject without colon");
  assertThrows(() => g.addTriple("http://ex.org/s", "", "http://ex.org/o"), "rejects empty predicate IRI");
  assertThrows(() => g.addTriple("http://ex.org/s", "noscheme", "http://ex.org/o"), "rejects predicate without colon");
}

// -- BNode support (integer IDs) --
suite("BNode support");
{
  const g = new JsRdfGraph();
  g.addTriple("_:b1", "http://ex.org/p", "http://ex.org/o");
  assert(g.size === 1, "blank node subject accepted");
  const bnodes = JSON.parse(g.bnodes());
  assert(bnodes.includes(1), "bnode integer id detected in subject");
}
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/s", "http://ex.org/p", "_:b2");
  const bnodes = JSON.parse(g.bnodes());
  assert(bnodes.includes(2), "bnode integer id detected in object");
}
{
  // N-Triples format uses _:bN
  const g = new JsRdfGraph();
  g.addTriple("_:b50", "http://ex.org/p", "value");
  const nt = g.toNTriples();
  assert(nt.includes("_:b50"), "bnode displayed as _:b<N> in N-Triples");
}

// -- Literal well-formedness --
suite("Literal well-formedness");
assertThrows(
  () => {
    const g = new JsRdfGraph();
    g.addTripleTyped("http://ex.org/s", "http://ex.org/p", "hello",
                     "http://www.w3.org/2001/XMLSchema#string");
    // Now try invalid: lang literal with wrong datatype
    g.addTripleLang("http://ex.org/s", "http://ex.org/p", "hello", "");
  },
  "rejects empty language tag" // empty lang treated differently
);
{
  const g = new JsRdfGraph();
  g.addTripleLang("http://ex.org/s", "http://ex.org/p", "bonjour", "fr");
  assert(g.size === 1, "language-tagged literal accepted");
}
{
  const g = new JsRdfGraph();
  g.addTripleTyped("http://ex.org/s", "http://ex.org/p", "42",
                   "http://www.w3.org/2001/XMLSchema#integer");
  assert(g.size === 1, "typed literal accepted");
}

// -- Plain literal (object without colon treated as plain string) --
suite("Plain literal");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/s", "http://ex.org/p", "Alice");
  assert(g.size === 1, "plain string object accepted");
  const nt = g.toNTriples();
  assert(nt.includes('"Alice"'), "plain literal in N-Triples output");
}

// -- Graph: add and size --
suite("Graph — add and size");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/knows", "http://ex.org/bob");
  g.addTripleLang("http://ex.org/bob", "http://xmlns.com/foaf/0.1/name", "Robert", "en");
  assert(g.size === 3, "three triples added");
}

// -- Graph: no duplicates --
suite("Graph — no duplicates");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  assert(g.size === 1, "duplicate not added");
}

// -- Graph: removeByIndex --
suite("Graph — removeByIndex");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/a", "http://ex.org/p", "val1");
  g.addTriple("http://ex.org/b", "http://ex.org/p", "val2");
  assert(g.size === 2, "two triples before remove");
  g.removeByIndex(0);
  assert(g.size === 1, "one triple after remove");
  assertThrows(() => g.removeByIndex(99), "rejects out-of-bounds index");
}

// -- Graph: findBySubject --
suite("Graph — findBySubject");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/knows", "http://ex.org/bob");
  g.addTriple("http://ex.org/bob", "http://xmlns.com/foaf/0.1/name", "Bob");
  const results = JSON.parse(g.findBySubject("http://ex.org/alice"));
  assert(results.length === 2, "finds both alice triples");
}

// -- Graph: findByPredicate --
suite("Graph — findByPredicate");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  g.addTripleLang("http://ex.org/bob", "http://xmlns.com/foaf/0.1/name", "Robert", "en");
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/knows", "http://ex.org/bob");
  const results = JSON.parse(g.findByPredicate("http://xmlns.com/foaf/0.1/name"));
  assert(results.length === 2, "finds both name triples");
}

// -- Graph: N-Triples output --
suite("Graph — N-Triples output");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  g.addTripleLang("http://ex.org/bob", "http://xmlns.com/foaf/0.1/name", "Robert", "en");
  const nt = g.toNTriples();
  assert(nt.includes("<http://ex.org/alice>"), "contains alice IRI");
  assert(nt.includes('"Alice"'), "contains Alice literal");
  assert(nt.includes('"Robert"@en'), "contains Robert lang literal");
}

// -- Graph: empty graph --
suite("Graph — empty");
{
  const g = new JsRdfGraph();
  assert(g.size === 0, "size is 0");
  assert(JSON.parse(g.bnodes()).length === 0, "no bnodes");
  assert(g.toNTriples() === "", "empty N-Triples");
}

// -- Graph: JSON output --
suite("Graph — JSON");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/s", "http://ex.org/p", "value");
  const json = g.toJSON();
  const parsed = JSON.parse(json);
  assert(typeof parsed === "object", "JSON parses");
  assert(parsed.triples !== undefined || Array.isArray(parsed), "has structure");
}

// -- Graph: triplesJSON --
suite("Graph — triplesJSON");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/s", "http://ex.org/p", "value");
  g.addTriple("http://ex.org/s", "http://ex.org/p", "http://ex.org/o");
  const triples = JSON.parse(g.triplesJSON());
  assert(Array.isArray(triples), "triplesJSON returns array");
  assert(triples.length === 2, "correct count");
}

// -- SPARQL: basic SELECT * --
suite("SPARQL — SELECT *");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  g.addTriple("http://ex.org/bob", "http://xmlns.com/foaf/0.1/name", "Bob");
  const result = JSON.parse(g.sparqlQuery("SELECT * WHERE { ?s ?p ?o }"));
  assert(result.variables.length === 3, "three variables");
  assert(result.rows.length === 2, "two result rows");
}

// -- SPARQL: PREFIX and specific variables --
suite("SPARQL — PREFIX and variables");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/knows", "http://ex.org/bob");
  const result = JSON.parse(g.sparqlQuery(
    `PREFIX foaf: <http://xmlns.com/foaf/0.1/>
     SELECT ?s ?name WHERE { ?s foaf:name ?name }`
  ));
  assert(result.variables.length === 2, "two variables selected");
  assert(result.rows.length === 1, "one name result");
}

// -- SPARQL: FILTER --
suite("SPARQL — FILTER");
{
  const g = new JsRdfGraph();
  g.addTripleLang("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice", "en");
  g.addTripleLang("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alicia", "es");
  const result = JSON.parse(g.sparqlQuery(
    `PREFIX foaf: <http://xmlns.com/foaf/0.1/>
     SELECT ?name WHERE { ?s foaf:name ?name . FILTER (LANG(?name) = "en") }`
  ));
  assert(result.rows.length === 1, "filter narrows to one result");
}

// -- SPARQL: DISTINCT --
suite("SPARQL — DISTINCT");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/knows", "http://ex.org/bob");
  const result = JSON.parse(g.sparqlQuery(
    `PREFIX foaf: <http://xmlns.com/foaf/0.1/>
     SELECT DISTINCT ?s WHERE { ?s ?p ?o }`
  ));
  assert(result.rows.length === 1, "distinct collapses to one subject");
}

// -- SPARQL: LIMIT/OFFSET --
suite("SPARQL — LIMIT and OFFSET");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/a", "http://ex.org/p", "1");
  g.addTriple("http://ex.org/b", "http://ex.org/p", "2");
  g.addTriple("http://ex.org/c", "http://ex.org/p", "3");
  const r1 = JSON.parse(g.sparqlQuery("SELECT * WHERE { ?s ?p ?o } LIMIT 2"));
  assert(r1.rows.length === 2, "LIMIT 2 gives 2 rows");
  const r2 = JSON.parse(g.sparqlQuery("SELECT * WHERE { ?s ?p ?o } LIMIT 2 OFFSET 2"));
  assert(r2.rows.length === 1, "LIMIT 2 OFFSET 2 gives 1 row");
}

// -- SPARQL: OPTIONAL --
suite("SPARQL — OPTIONAL");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/alice", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://xmlns.com/foaf/0.1/Person");
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  g.addTriple("http://ex.org/bob", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://xmlns.com/foaf/0.1/Person");
  const result = JSON.parse(g.sparqlQuery(
    `PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
     PREFIX foaf: <http://xmlns.com/foaf/0.1/>
     SELECT ?s ?name WHERE {
       ?s rdf:type foaf:Person .
       OPTIONAL { ?s foaf:name ?name }
     }`
  ));
  assert(result.rows.length === 2, "OPTIONAL returns both persons");
  // One should have a name, one should have null
  const hasNull = result.rows.some(r => r.some(c => c === null));
  assert(hasNull, "bob has null name from OPTIONAL");
}

// -- SPARQL: join across patterns --
suite("SPARQL — pattern join");
{
  const g = new JsRdfGraph();
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/name", "Alice");
  g.addTriple("http://ex.org/alice", "http://xmlns.com/foaf/0.1/knows", "http://ex.org/bob");
  g.addTriple("http://ex.org/bob", "http://xmlns.com/foaf/0.1/name", "Bob");
  const result = JSON.parse(g.sparqlQuery(
    `PREFIX foaf: <http://xmlns.com/foaf/0.1/>
     SELECT ?name ?friendName WHERE {
       ?s foaf:name ?name .
       ?s foaf:knows ?friend .
       ?friend foaf:name ?friendName
     }`
  ));
  assert(result.rows.length === 1, "join produces one result");
}

// -- SPARQL: error handling --
suite("SPARQL — error handling");
assertThrows(() => {
  const g = new JsRdfGraph();
  g.sparqlQuery("THIS IS NOT SPARQL");
}, "rejects invalid query");

// =========================================================================
//  Summary
// =========================================================================

const total = passed + failed;
const summary = document.getElementById("summary");
if (failed === 0) {
  summary.innerHTML = `<span class="pass">ALL ${total} TESTS PASSED</span>`;
  summary.style.borderColor = "#4ade80";
} else {
  summary.innerHTML = `<span class="fail">${failed} FAILED</span> / ${total} total`;
  summary.style.borderColor = "#f87171";
}
</script>
</body>
</html>
