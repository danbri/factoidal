# Publish npm/factoidal (@factoidal/core) to npmjs.com via TRUSTED
# PUBLISHING (OIDC) — no npm tokens anywhere.
#
# https://docs.npmjs.com/trusted-publishers
# Requirements met here: GitHub-hosted runner; id-token: write; npm CLI
# >= 11.5.1 + Node >= 22.14 (Node 24 ships npm 11.x; the version-check
# step makes a too-old npm fail loudly rather than fall back to token
# auth); package.json's repository.url matches this repository.
#
# npmjs.com side (one-time, owner): package Settings -> Trusted
# Publisher -> GitHub Actions with EXACTLY:
#   Organization or user: danbri
#   Repository:           factoidal
#   Workflow filename:    npm-publish.yml
#   Environment name:     (leave blank)
#   Allowed actions:      npm publish
# Fields are case-sensitive; npm validates them only at publish time.
#
# PROVENANCE-AS-EXTRACTION-PEDIGREE (issue #465, rung 2 of 4): before
# publishing, this workflow RE-EXTRACTS the F* corpus at this commit
# and fails on ANY drift against the committed OCaml. The npm
# provenance attestation (automatic under trusted publishing:
# Sigstore-signed, Rekor-logged, `npm audit signatures`) therefore
# covers the check itself — the published tarball is bound to a commit
# whose committed extraction output was re-derived from its .fst
# sources inside this very workflow. A witness step logs the F*/z3
# versions, the .fst input-tree digest, and the tarball digest into
# the attested run. What this does NOT yet attest: the js_of_ocaml
# bundle layer (rung 3 builds the package from source in-workflow;
# rung 4 signs intermediates). Caveat, always: provenance proves
# PEDIGREE, not the theorems — the theorems are the verify steps this
# pipeline runs and the no-admits/no-lax property of the source.
#
# Trigger: manual (workflow_dispatch) or an npm-v* tag. The publish
# ships the COMMITTED npm/factoidal tree — bundles are committed
# (iron rule #9 family) — after the drift check passes. The package's
# own prepublishOnly gate (npm test, 180+ tests) still runs inside
# npm publish.
#
# Cost: ~5-10 min with warm opam/.checked caches; a cold cache
# re-verifies the tree (~2 h, same as check-extraction.yml cold).
name: npm-publish
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'npm-v*'
permissions:
  id-token: write   # OIDC — required for trusted publishing
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # submodules: recursive is REQUIRED, not tidiness. `npm publish`
      # runs prepublishOnly -> npm test, and the npm suite reads vendored
      # W3C fixtures from submodules under third_party/testing/ (e.g.
      # csvw/tests/tree-ops.csv). Without them the suite dies on ENOENT
      # and the publish aborts -- which is exactly how run 2 failed on
      # 2026-08-27, 22 minutes AFTER the extraction drift check passed.
      # check-extraction.yml has always had this; this workflow was
      # copied from it without the `with:` block.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Extraction drift check (issue #465 rung 2) --------------
      # Cache blocks mirror check-extraction.yml (#238).
      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-fstar-${{ runner.os }}-v4
          restore-keys: |
            opam-fstar-${{ runner.os }}-

      - name: Cache F* .checked files
        uses: actions/cache@v4
        with:
          path: formal/fstar/*.fst.checked
          key: fstar-checked-${{ runner.os }}-${{ hashFiles('formal/fstar/*.fst', 'formal/fstar/*.fsti') }}
          restore-keys: |
            fstar-checked-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev pkg-config libzstd-dev

      - name: Setup opam + F*
        run: |
          if [ ! -d ~/.opam ]; then
            opam init -y --disable-sandboxing
          fi
          if ! opam switch list 2>/dev/null | grep -q fstar; then
            opam switch create fstar ocaml-base-compiler.4.14.1
          fi
          eval $(opam env --switch=fstar)
          opam pin add z3 4.13.3 -y --no-action 2>/dev/null || true
          opam install -y fstar z3.4.13.3 zarith sha digestif ocamlfind uucp
          echo "OPAMSWITCH=fstar" >> $GITHUB_ENV
          fstar.exe --version
          z3 --version

      - name: Re-extract F* and fail on drift vs the committed OCaml
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          # --force-full: bypass the incremental-extract manifest.
          # Without it a manifest hit turns extraction into a no-op and
          # this drift check into a vacuous pass (the silently-no-op
          # hazard) — the whole point is to re-derive every module's .ml
          # here.
          #
          # Two corrections, 2026-08-26. (1) The manifest is NOT
          # committed — `git ls-files
          # formal/fstar/ocaml-output/.extract-state/` is empty — so a
          # CI checkout has none and plain `extract` is already full
          # here. The flag still matters for local runs. (2) Until
          # 2026-08-26 this exact invocation did not reach the flag at
          # all: build-ocaml.sh's multi-step loop read `--force-full` as
          # a step name. See
          # docs/designissues/2026-08-26-extraction-drift-root-cause.md.
          ./build-ocaml.sh extract --force-full
          cd ../..
          # The extracted + patched .ml must be byte-identical to what
          # this commit ships. Any diff means the committed extraction
          # output does not derive from the committed .fst — refuse to
          # bind that state into a provenance attestation.
          if ! git diff --stat --exit-code -- 'formal/fstar/ocaml-output/*.ml'; then
            echo '::error::extraction drift: committed .ml does not match a fresh extraction of this commit''s .fst'
            exit 1
          fi

      - name: Witness (issue #465 rung 1) — versions + input/output digests into the attested log
        run: |
          eval $(opam env --switch=fstar)
          echo "== extraction pedigree witness =="
          echo "commit: $GITHUB_SHA"
          fstar.exe --version | head -1
          z3 --version | head -1
          echo "fst-tree-sha256: $(git ls-files 'formal/fstar/*.fst' 'formal/fstar/*.fsti' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          echo "glue-tree-sha256: $(git ls-files 'formal/fstar/ocaml-patches.sh' 'formal/fstar/experimental_ocaml_glue/*' 'formal/fstar/minimal_regrettable_glue_code_each_with_an_open_issue/*' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)"
          echo "npm-package-files:"
          (cd npm/factoidal && npx --yes npm@latest pack --dry-run --json 2>/dev/null | head -5) || true

      # --- Publish (trusted publishing / OIDC) ---------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check npm version (trusted publishing needs >= 11.5.1)
        run: |
          node --version
          npm --version
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 5)) { print "npm too old for trusted publishing"; exit 1 } }'
      - name: Publish (OIDC; provenance generated automatically)
        working-directory: npm/factoidal
        run: npm publish
