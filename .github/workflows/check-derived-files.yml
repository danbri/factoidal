# Block PRs that directly edit F*-extracted OCaml files.
# These files are regenerated by ./build-ocaml.sh extract and patched by
# ocaml-patches.sh. Direct edits get silently destroyed on re-extraction.
#
# If you need to change extracted behavior:
#   1. Fix the F* source (.fst) if possible
#   2. Otherwise add a patch to ocaml-patches.sh
#   3. Never edit the .ml files directly

name: Check derived files

on:
  pull_request:
    paths:
      - 'formal/fstar/ocaml-output/*.ml'

jobs:
  check-derived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for edits to F*-extracted files
        run: |
          # Files that are generated by F* extraction (DO NOT EDIT DIRECTLY)
          EXTRACTED_FILES=(
            "formal/fstar/ocaml-output/RDF_Graph_Executable.ml"
            "formal/fstar/ocaml-output/SPARQL11_Algebra.ml"
            "formal/fstar/ocaml-output/SPARQL11_Parser.ml"
            "formal/fstar/ocaml-output/Parser_Combinators.ml"
            "formal/fstar/ocaml-output/Parser_NTriples.ml"
            "formal/fstar/ocaml-output/Parser_Turtle.ml"
            "formal/fstar/ocaml-output/Parser_NQuads.ml"
            "formal/fstar/ocaml-output/Parser_TriG.ml"
            "formal/fstar/ocaml-output/Parser_XML.ml"
            "formal/fstar/ocaml-output/Parser_RDFXML.ml"
            "formal/fstar/ocaml-output/Parser_SRX.ml"
            "formal/fstar/ocaml-output/Parser_CSVResults.ml"
          )

          # Get list of changed .ml files in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'formal/fstar/ocaml-output/*.ml')

          VIOLATIONS=""
          for file in $CHANGED; do
            for extracted in "${EXTRACTED_FILES[@]}"; do
              if [ "$file" = "$extracted" ]; then
                VIOLATIONS="$VIOLATIONS\n  - $file"
              fi
            done
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Direct edits to F*-extracted files detected!"
            echo ""
            echo "The following files are generated by F* extraction and"
            echo "will be overwritten by ./build-ocaml.sh extract:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "Instead of editing these files directly:"
            echo "  1. Fix the F* source (.fst file) if possible"
            echo "  2. Add a post-extraction patch to ocaml-patches.sh"
            echo "  3. Run ./build-ocaml.sh extract to regenerate + patch"
            echo ""
            echo "See CLAUDE.md anti-pattern #13 for details."
            exit 1
          fi

          echo "No direct edits to extracted files. OK."
