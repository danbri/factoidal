name: W3C Test Suite

on:
  push:
    branches: [main, master, claude/main, 'claude/**']
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-fstar-${{ runner.os }}-v3
          restore-keys: |
            opam-fstar-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev pkg-config

      - name: Install binaryen (wasm-merge) from GitHub release
        run: |
          # Ubuntu's binaryen package is too old to include wasm-merge, which
          # wasm_of_ocaml 6.3+ requires to build.
          # See https://github.com/ocsigen/js_of_ocaml/issues/2190.
          BINARYEN_VERSION=version_129
          curl -sL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          wasm-merge --version
          wasm-opt --version

      - name: Setup opam + F*
        run: |
          if [ ! -d ~/.opam ]; then
            opam init -y --disable-sandboxing
            opam switch create fstar ocaml-base-compiler.4.14.1
          fi
          eval $(opam env --switch=fstar)
          # Pin z3 to 4.13.3 — F* 2025.12.15 requires exact match
          opam pin add z3 4.13.3 -y --no-action 2>/dev/null || true
          opam install -y fstar z3.4.13.3 zarith sha digestif
          # wasm_of_ocaml: binaryen is available via /usr/local from the
          # previous step; opam's conf-binaryen just probes for wasm-opt in
          # PATH. --assume-depexts skips system-package re-check.
          opam install -y --assume-depexts js_of_ocaml js_of_ocaml-compiler zarith_stubs_js wasm_of_ocaml-compiler
          echo "OPAMSWITCH=fstar" >> $GITHUB_ENV

      - name: Build (extract + compile + JS)
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          # Canonical pipeline: extract, patch, compile native, compile JS.
          # No --lax, full verification.
          ./build-ocaml.sh

      - name: Build Wasm
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          ./build-ocaml.sh wasm

      - name: Smoke test Wasm
        run: |
          cd docs/fstar-extracted
          # bind is a zarith-heavy suite; if it passes, the wasm init +
          # zarith runtime + manifest parser all round-tripped cleanly.
          RESULT=$(node w3c-runner.wasm.js bind)
          echo "$RESULT"
          echo "$RESULT" | grep -q '^  bind[[:space:]]*pass:10 fail:0' || {
            echo "::error::Wasm smoke test failed — bind suite did not pass 10/10"
            exit 1
          }

      - name: Full Wasm suite (SPARQL + RDF)
        run: |
          cd docs/fstar-extracted
          # Run everything under Node's wasm_of_ocaml path. This is slower
          # than native (~5-10 min) but gives us parity visibility vs the
          # native runner. We record the results but do not gate CI on them
          # — known wasm-side gaps (property-path: 29/33, 4 tests below
          # native; some hashes if digestif regresses) don't block merges.
          WASM_RC=0
          node w3c-runner.wasm.js --all 2>&1 | tee wasm_results.log || WASM_RC=$?
          echo "Wasm runner exit: $WASM_RC"
          # Extract the two TOTAL lines for quick CI-log visibility.
          grep -E '^TOTAL' wasm_results.log || true
          echo "=== Wasm vs native diff ==="
          diff <(grep -E '^  [a-z].*pass:' ../../formal/fstar/ocaml-output/sparql_results.log) \
               <(grep -E '^  [a-z].*pass:' wasm_results.log) \
               || echo "(differences above — check which suites diverge)"

      - name: Run tests and generate report
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          ./generate-report.sh --run

      - name: Commit results + artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/test-results/ \
                  docs/fstar-extracted/ \
                  docs/fstar-extracted/wasm_results.log \
                  formal/fstar/ocaml-output/sparql_results.log \
                  formal/fstar/ocaml-output/rdf_results.log
          git diff --cached --quiet || git commit -m "Update W3C test results + JS/Wasm artifacts [skip ci]"
          git push || true
