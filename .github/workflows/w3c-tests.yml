name: W3C Test Suite

on:
  push:
    branches: [main, master, claude/main]
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-fstar-${{ runner.os }}-v3
          restore-keys: |
            opam-fstar-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev pkg-config

      - name: Setup opam + F*
        run: |
          if [ ! -d ~/.opam ]; then
            opam init -y --disable-sandboxing
            opam switch create fstar ocaml-base-compiler.4.14.1
          fi
          eval $(opam env --switch=fstar)
          opam install -y fstar z3 zarith sha digestif
          echo "OPAMSWITCH=fstar" >> $GITHUB_ENV

      - name: Build (extract + compile)
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          # Use the canonical build script — no --lax, full verification
          ./build-ocaml.sh

      - name: Run SPARQL tests
        id: sparql
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar/ocaml-output
          ./w3c_runner 2>&1 | tee /tmp/sparql-results.txt
          tail -3 /tmp/sparql-results.txt | head -1 | tee /tmp/sparql-totals.txt

      - name: Run RDF tests
        id: rdf
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar/ocaml-output
          ./w3c_runner --rdf 2>&1 | tee /tmp/rdf-results.txt
          tail -3 /tmp/rdf-results.txt | head -1 | tee /tmp/rdf-totals.txt

      - name: Generate results page
        run: |
          mkdir -p docs/test-results
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > docs/test-results/index.html << HTMLEOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Factoidal W3C Test Results</title>
            <meta charset="utf-8">
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; max-width: 760px; margin: 2em auto; padding: 0 1em; line-height: 1.6; color: #333; }
              h1 { border-bottom: 2px solid #2d6a4f; padding-bottom: 0.3em; }
              h2 { margin-top: 1.8em; }
              a { color: #2d6a4f; }
              nav { margin-bottom: 2em; font-size: 0.9em; }
              nav a { margin-right: 1.2em; }
              .pass { color: green; font-weight: bold; }
              .fail { color: red; }
              pre { background: #f8f8f8; padding: 1em; overflow-x: auto; border-radius: 4px; border: 1px solid #ddd; }
              .timestamp { color: #666; font-size: 0.9em; }
              footer { margin-top: 3em; border-top: 1px solid #ddd; padding-top: 1em; font-size: 0.9em; color: #666; }
            </style>
          </head>
          <body>
          <nav>
            <a href="/factoidal/">Home</a>
            <a href="/factoidal/test-results/">Test Results</a>
            <a href="https://github.com/danbri/factoidal">GitHub</a>
          </nav>
          <h1>W3C Test Results</h1>
          <p class="timestamp">Generated: ${TIMESTAMP}</p>
          <p>These results are generated automatically by CI from actual test runs.
          Source: <a href="https://github.com/danbri/factoidal/actions/workflows/w3c-tests.yml">W3C Test Suite workflow</a></p>
          <h2>SPARQL 1.1</h2>
          <pre>
          HTMLEOF

          grep "^  " /tmp/sparql-results.txt | grep -E "pass:|fail:" >> docs/test-results/index.html

          cat >> docs/test-results/index.html << HTMLEOF
          </pre>
          <p><strong>$(cat /tmp/sparql-totals.txt)</strong></p>
          <h2>RDF 1.1</h2>
          <pre>
          HTMLEOF

          grep "^  " /tmp/rdf-results.txt | grep -E "pass:|fail:" >> docs/test-results/index.html

          cat >> docs/test-results/index.html << HTMLEOF
          </pre>
          <p><strong>$(cat /tmp/rdf-totals.txt)</strong></p>
          <footer>Factoidal — verified RDF/SPARQL from F*.</footer>
          </body></html>
          HTMLEOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/test-results/
          git diff --cached --quiet || git commit -m "Update W3C test results"
          git push || true
