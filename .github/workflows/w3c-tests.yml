name: W3C Test Suite

on:
  push:
    branches: [main, master, claude/main, 'claude/**']
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-fstar-${{ runner.os }}-v3
          restore-keys: |
            opam-fstar-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev pkg-config

      - name: Setup opam + F*
        run: |
          if [ ! -d ~/.opam ]; then
            opam init -y --disable-sandboxing
            opam switch create fstar ocaml-base-compiler.4.14.1
          fi
          eval $(opam env --switch=fstar)
          # Pin z3 to 4.13.3 — F* 2025.12.15 requires exact match
          opam pin add z3 4.13.3 -y --no-action 2>/dev/null || true
          opam install -y fstar z3.4.13.3 zarith sha digestif
          echo "OPAMSWITCH=fstar" >> $GITHUB_ENV

      - name: Build (extract + compile)
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          # Use the canonical build script — no --lax, full verification
          ./build-ocaml.sh

      - name: Run tests and generate report
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          ./generate-report.sh --run

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/test-results/ formal/fstar/ocaml-output/sparql_results.log formal/fstar/ocaml-output/rdf_results.log
          git diff --cached --quiet || git commit -m "Update W3C test results [skip ci]"
          git push || true
