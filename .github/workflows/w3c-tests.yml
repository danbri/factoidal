name: W3C Test Suite

on:
  push:
    # Only main lines. The dashboard at docs/test-results/latest.json
    # is fed by these refs; feature-branch runs would not be useful
    # anyway and previously caused minute-burn + cancellation storms.
    branches: [main, master, claude/main]
  schedule:
    # Two safety-net runs at 04:00 and 05:00 UTC. Each entry below
    # gates itself on "≥30 minutes of quiet on the head ref"; if
    # there's been a recent push, the schedule run skips and the
    # push's own debounced run is responsible for updating the
    # dashboard. Two slots give a second chance if 04:00 happens
    # to coincide with someone merging.
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Concurrency: per-SHA so concurrent debouncers from different
# pushes don't cancel each other. The debouncer in the first job
# decides whether each run actually proceeds (tail-edge debounce).
concurrency:
  group: w3c-tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # debounce — tail-edge quiet-window guard.
  #
  # PR splurges (several related merges within minutes) used to fire one
  # full ~30-minute W3C suite per merge. With cancel-in-progress: true
  # this caused the dashboard to never update; with cancel-in-progress:
  # false (#174) it just wasted CI minutes running the suite N times.
  #
  # This job sleeps 5 minutes, then checks whether HEAD has moved on the
  # ref since this run was triggered. If HEAD moved, exit cleanly (the
  # newer push's own debounce job is now in flight and will decide).
  # Only the LAST push in a quiet window proceeds to the actual suite.
  #
  # For schedule triggers (04:00 / 05:00 UTC), an additional 30-minute
  # quiet check on the head commit's age: if the ref has been written
  # to within the last 30 minutes, the schedule run skips (a push-
  # triggered run is responsible).
  #
  # workflow_dispatch always proceeds (manual override).
  # ---------------------------------------------------------------------
  debounce:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref }}
          MY_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu

          # workflow_dispatch: always proceed, no debounce.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch — bypassing debounce."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # schedule: skip if any commit on the ref in the last 30 min.
          if [ "$EVENT" = "schedule" ]; then
            HEAD_TIME=$(gh api "repos/$REPO/commits/$MY_SHA" --jq .commit.committer.date)
            HEAD_EPOCH=$(date -u -d "$HEAD_TIME" +%s)
            NOW_EPOCH=$(date -u +%s)
            AGE=$(( NOW_EPOCH - HEAD_EPOCH ))
            if [ "$AGE" -lt 1800 ]; then
              echo "Schedule trigger but head ($MY_SHA) is only $AGE s old (< 30 min)."
              echo "Skipping; a push-debounced run will handle it."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Schedule trigger; head age $AGE s (≥ 30 min). Proceeding through debounce."
          fi

          # Tail-edge debounce: sleep 5 min, then check if anyone else
          # pushed during the wait. If yes, defer to the newer run.
          echo "::group::Debounce — waiting 300s for activity to settle"
          sleep 300
          echo "::endgroup::"

          BRANCH="${REF#refs/heads/}"
          LATEST_SHA=$(gh api "repos/$REPO/commits/$BRANCH" --jq .sha)
          if [ "$LATEST_SHA" != "$MY_SHA" ]; then
            echo "HEAD moved during wait: $MY_SHA → $LATEST_SHA"
            echo "Skipping; the run for $LATEST_SHA will take over."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Quiet for 5 minutes. Proceeding to W3C suite."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  native-shadow:
    needs: debounce
    if: needs.debounce.outputs.proceed == 'true'
    # Dual-platform native shadow builds. Each matrix leg auto-commits
    # binaries to bin/ci-<platform>/ (NOT bin/<platform>/ — those stay
    # reserved for local builds + manual promotion). Extracted .ml files
    # land in formal/fstar/ocaml-output-ci/ from both legs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            ci_dir: bin/ci-linux-x86_64
            primary: true
          - os: macos-14
            platform: darwin-arm64
            ci_dir: bin/ci-darwin-arm64
            primary: false
    runs-on: ${{ matrix.os }}
    # macOS install path is still being shaken out — let it iterate
    # without blocking the canonical Ubuntu green light.
    continue-on-error: ${{ !matrix.primary }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-fstar-${{ runner.os }}-v3
          restore-keys: |
            opam-fstar-${{ runner.os }}-

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev pkg-config

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # macos-14 = Apple Silicon (arm64). The opam formula brings in
          # ocaml-base-compiler via the switch step. zstd is needed for
          # parquet/cottas paths; gmp/pkg-config mirror the Linux deps.
          # Note: brew exits non-zero if a package is already installed;
          # the `|| true` guards we'd be tempted to add are banned by
          # rule #14, so we use `--quiet` and check each formula instead.
          for pkg in opam gmp pkg-config zstd; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Install binaryen (wasm-merge) from GitHub release
        # Wasm pipeline runs on Linux only (sufficient parity signal,
        # halves macOS wall-clock).
        if: runner.os == 'Linux'
        run: |
          # Ubuntu's binaryen package is too old to include wasm-merge, which
          # wasm_of_ocaml 6.3+ requires to build.
          # See https://github.com/ocsigen/js_of_ocaml/issues/2190.
          BINARYEN_VERSION=version_129
          curl -sL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          wasm-merge --version
          wasm-opt --version

      - name: Setup opam + F*
        run: |
          if [ ! -d ~/.opam ]; then
            opam init -y --disable-sandboxing
            opam switch create fstar ocaml-base-compiler.4.14.1
          fi
          eval $(opam env --switch=fstar)
          # Pin z3 to 4.13.3 — F* 2025.12.15 requires exact match
          opam pin add z3 4.13.3 -y --no-action 2>/dev/null || true
          opam install -y fstar z3.4.13.3 zarith sha digestif
          echo "OPAMSWITCH=fstar" >> $GITHUB_ENV

      - name: Build native (extract + compile)
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          # Build the native binaries first so the CI shadow bin folders can
          # be updated even if later JS / wasm steps regress.
          ./build-ocaml.sh extract
          ./build-ocaml.sh compile

      - name: Stage CI shadow artifacts
        run: |
          set -euo pipefail
          PLATFORM='${{ matrix.platform }}'
          CI_BIN_DIR='${{ matrix.ci_dir }}'
          SRC_BIN_DIR="bin/${PLATFORM}"
          # Wipe + repopulate the shadow bin dir for this platform.
          # Keep .gitkeep so the folder remains tracked even if a future
          # build produces zero binaries.
          mkdir -p "$CI_BIN_DIR"
          find "$CI_BIN_DIR" -mindepth 1 -maxdepth 1 ! -name '.gitkeep' -exec rm -rf {} +
          if [ -d "$SRC_BIN_DIR" ]; then
            cp -R "$SRC_BIN_DIR"/* "$CI_BIN_DIR/" 2>/dev/null || true
          fi
          # Mirror extracted .ml into the shared shadow folder (both legs
          # write here; whichever pushes last wins — this is fine because
          # the .ml is platform-independent).
          mkdir -p formal/fstar/ocaml-output-ci
          find formal/fstar/ocaml-output-ci -mindepth 1 -maxdepth 1 \
            ! -name '.gitkeep' -exec rm -rf {} +
          if compgen -G "formal/fstar/ocaml-output/*.ml" > /dev/null; then
            cp formal/fstar/ocaml-output/*.ml formal/fstar/ocaml-output-ci/
          fi
          # Build manifest with timestamp, SHA, toolchain versions, file hashes.
          eval $(opam env --switch=fstar) || true
          FSTAR_VERSION="$(fstar.exe --version 2>/dev/null | head -n 1 || echo unknown)"
          OCAML_VERSION="$(ocaml -version 2>/dev/null || echo unknown)"
          OPAM_SWITCH="$(opam switch show 2>/dev/null || echo unknown)"
          SOURCE_SHA="$(git rev-parse HEAD)"
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          MANIFEST="$CI_BIN_DIR/build-info.json"
          {
            printf '{\n'
            printf '  "platform": "%s",\n' "$PLATFORM"
            printf '  "runner_os": "%s",\n' "${{ runner.os }}"
            printf '  "timestamp_utc": "%s",\n' "$TIMESTAMP"
            printf '  "source_sha": "%s",\n' "$SOURCE_SHA"
            printf '  "fstar_version": "%s",\n' "$FSTAR_VERSION"
            printf '  "ocaml_version": "%s",\n' "$OCAML_VERSION"
            printf '  "opam_switch": "%s",\n' "$OPAM_SWITCH"
            printf '  "binaries": {\n'
            FIRST=1
            for f in $(find "$CI_BIN_DIR" -maxdepth 1 -type f \
                         ! -name '.gitkeep' ! -name 'build-info.json' \
                         | sort); do
              base="$(basename "$f")"
              if [ "${{ runner.os }}" = "Linux" ]; then
                SUM="$(sha256sum "$f" | awk '{print $1}')"
              else
                SUM="$(shasum -a 256 "$f" | awk '{print $1}')"
              fi
              SIZE="$(wc -c < "$f" | tr -d ' ')"
              if [ "$FIRST" -eq 1 ]; then FIRST=0; else printf ',\n'; fi
              printf '    "%s": { "sha256": "%s", "size": %s }' \
                "$base" "$SUM" "$SIZE"
            done
            printf '\n  }\n'
            printf '}\n'
          } > "$MANIFEST"
          echo "=== Manifest ==="
          cat "$MANIFEST"
          echo "=== Files staged ==="
          ls -la "$CI_BIN_DIR"

      - name: Commit + push CI shadow artifacts
        # Only push back when running on claude/main. PR-branch builds
        # still produce the binaries (used by the in-job test step),
        # but we don't push them back to the branch. This keeps PR
        # branches diverging from main only on the actual code changes,
        # not on auto-generated binary blobs that would otherwise
        # collide with main's shadow commits on every parallel PR.
        if: github.ref == 'refs/heads/claude/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Register the `merge=ours` driver referenced by .gitattributes
          # for bin/ci-*/*. Used below if `git pull --rebase` races with
          # another concurrent main-branch push.
          git config merge.ours.driver true

          git add '${{ matrix.ci_dir }}'
          git add formal/fstar/ocaml-output-ci/

          if git diff --cached --quiet; then
            echo "No CI shadow artifact changes to commit on ${{ matrix.platform }}."
            exit 0
          fi

          PLATFORM='${{ matrix.platform }}'
          git commit -m "ci(${PLATFORM}): shadow build artifacts [skip ci]"

          # Native builds leave local generated files outside the staged shadow
          # dirs. Stash them so rebase can proceed cleanly if we need to sync
          # with a newer branch tip before pushing.
          if [ -n "$(git status --porcelain)" ]; then
            git stash push --include-untracked -m "ci-shadow-pre-push-${PLATFORM}" || true
          fi

          PUSH_RC=1
          for attempt in 1 2 3; do
            echo "Push attempt $attempt for ${PLATFORM}..."
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              PUSH_RC=0
              echo "Push succeeded on attempt $attempt."
              break
            fi
            echo "::warning::git push failed on attempt $attempt — attempting rebase"
            git rebase --abort 2>/dev/null || true
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "::warning::git pull --rebase failed on attempt $attempt"
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
              continue
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              PUSH_RC=0
              echo "Push succeeded on attempt $attempt."
              break
            fi
            echo "::warning::git push failed on attempt $attempt — retrying"
            sleep $((attempt * 5))
          done
          if [ "$PUSH_RC" -ne 0 ]; then
            echo "::error::Failed to push CI shadow artifacts after 3 attempts"
            exit "$PUSH_RC"
          fi

      - name: Run tests (Linux — native binaries only)
        if: runner.os == 'Linux'
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          ./build-ocaml.sh test

      - name: Run tests (macOS — native binaries only)
        if: runner.os == 'macOS'
        run: |
          # macOS leg: skip the full suite / docs refresh (Linux owns those).
          # Just exercise the freshly-built native runner so the binary we
          # commit to bin/ci-darwin-arm64/ has at least one round-trip.
          eval $(opam env --switch=fstar)
          cd formal/fstar/ocaml-output
          ./w3c_runner bind 2>&1 | tee /tmp/macos_smoke.log || true
          grep -q 'bind' /tmp/macos_smoke.log

  browser-artifacts:
    # Linux-only browser/runtime artifacts. This job owns JS / wasm / docs
    # generation and can fail independently from the native shadow binaries.
    needs: native-shadow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-fstar-${{ runner.os }}-v3
          restore-keys: |
            opam-fstar-${{ runner.os }}-

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev pkg-config

      - name: Install binaryen (wasm-merge) from GitHub release
        run: |
          BINARYEN_VERSION=version_129
          curl -sL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          wasm-merge --version
          wasm-opt --version

      - name: Setup opam + F*
        run: |
          if [ ! -d ~/.opam ]; then
            opam init -y --disable-sandboxing
            opam switch create fstar ocaml-base-compiler.4.14.1
          fi
          eval $(opam env --switch=fstar)
          opam pin add z3 4.13.3 -y --no-action 2>/dev/null || true
          opam install -y fstar z3.4.13.3 zarith sha digestif
          opam install -y --assume-depexts js_of_ocaml js_of_ocaml-compiler zarith_stubs_js wasm_of_ocaml-compiler
          echo "OPAMSWITCH=fstar" >> $GITHUB_ENV

      - name: Build native (extract + compile)
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          ./build-ocaml.sh extract
          ./build-ocaml.sh compile

      - name: Build JS
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          ./build-ocaml.sh js

      - name: Build Wasm
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          ./build-ocaml.sh wasm

      - name: Run tests and generate report
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          ./build-ocaml.sh test

      - name: Smoke test Wasm
        run: |
          cd docs/fstar-extracted
          RESULT=$(node w3c-runner.wasm.js bind)
          echo "$RESULT"
          echo "$RESULT" | grep -q '^  bind[[:space:]]*pass:10 fail:0' || {
            echo "::error::Wasm smoke test failed — bind suite did not pass 10/10"
            exit 1
          }

      - name: Full Wasm suite (SPARQL + RDF)
        run: |
          cd docs/fstar-extracted
          WASM_RC=0
          node w3c-runner.wasm.js --all 2>&1 | tee wasm_results.log || WASM_RC=$?
          echo "Wasm runner exit: $WASM_RC"
          grep -E '^TOTAL' wasm_results.log || true
          echo "=== Wasm vs native diff ==="
          diff <(grep -E '^  [a-z].*pass:' ../../formal/fstar/ocaml-output/sparql_results.log) \
               <(grep -E '^  [a-z].*pass:' wasm_results.log) \
               || echo "(differences above — check which suites diverge)"

      - name: Commit + push Linux generated docs artifacts
        # Same scope as the CI shadow artifacts step above: only push
        # to claude/main, never to PR branches.
        if: github.ref == 'refs/heads/claude/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Register the `merge=ours` driver referenced by .gitattributes
          # (defense-in-depth for concurrent main-branch pushes).
          git config merge.ours.driver true

          git add docs/test-results/ \
                  docs/fstar-extracted/ \
                  docs/fstar-extracted/wasm_results.log \
                  formal/fstar/ocaml-output/sparql_results.log \
                  formal/fstar/ocaml-output/rdf_results.log

          if git diff --cached --quiet; then
            echo "No Linux generated docs artifacts to commit."
            exit 0
          fi

          git commit -m "ci(linux-x86_64): generated docs artifacts [skip ci]"

          # Docs/wasm generation leaves other outputs around; stash them so a
          # rebase is not blocked by unrelated local modifications.
          if [ -n "$(git status --porcelain)" ]; then
            git stash push --include-untracked -m "ci-docs-pre-push" || true
          fi

          PUSH_RC=1
          for attempt in 1 2 3; do
            echo "Push attempt $attempt for Linux generated docs artifacts..."
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              PUSH_RC=0
              echo "Push succeeded on attempt $attempt."
              break
            fi
            echo "::warning::git push failed on attempt $attempt — attempting rebase"
            git rebase --abort 2>/dev/null || true
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "::warning::git pull --rebase failed on attempt $attempt"
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
              continue
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              PUSH_RC=0
              echo "Push succeeded on attempt $attempt."
              break
            fi
            echo "::warning::git push failed on attempt $attempt — retrying"
            sleep $((attempt * 5))
          done
          if [ "$PUSH_RC" -ne 0 ]; then
            echo "::error::Failed to push Linux generated docs artifacts after 3 attempts"
            exit "$PUSH_RC"
          fi
