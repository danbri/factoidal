# Phase 8 D CI gate (#200): forbid hand-written .ml in
# formal/fstar/ocaml-output/. That directory is reserved for
# F\*-extracted output + assume-val realisations only.
#
# Detection:
#   - F\*-extracted .ml always starts with `open Prims`.
#   - Anything else is treated as hand-written and must be either:
#     a) on the explicit allowlist below (grandfathered glue files),
#        each with an in-line note about the migration plan, OR
#     b) relocated to bin/<consumer>/ per the migration epic.
#
# Hard-fails on PR. Net-new hand-written .ml in ocaml-output/ that is
# not in the allowlist will block the merge until the file is
# relocated.

name: Check formal/fstar/ocaml-output/ cleanliness (rule #11 D)

on:
  push:
    branches: [main, master, claude/main]
  pull_request:
    branches: [main, master, claude/main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ocaml-output/*.ml are F\*-extracted or grandfathered
        run: |
          set -euo pipefail
          OUTDIR="formal/fstar/ocaml-output"

          # Allowlist of hand-written files that may live in ocaml-output/.
          # Each entry must have a brief comment explaining its status.
          # The list shrinks as files get relocated under bin/<consumer>/
          # or retired entirely. Adding to this list requires a PR-body
          # justification; CI does not enforce that, but reviewers
          # should.
          ALLOWLIST=(
            # Vendored crypto: pure-OCaml MD5/SHA-1/SHA-2 implementations
            # provide Fstar_pure_hashes.{sha256,sha1,md5} used by
            # 63_regex_hash_uuid_stubs.sh to wire SPARQL11.Algebra's
            # hash_* assume vals + RDF_Canonical's hash_sha256.
            # Rule #11(c) — vendored crypto primitive realisation;
            # permanent fixture, not a retirement candidate.
            "fstar_pure_hashes.ml"
            # Rule #11(c) — vendored crypto realisation, the Ed25519 +
            # SHA-256 half of what fstar_pure_hashes.ml does for the
            # SPARQL/RDFC hashes. Pure `external` call-outs to the
            # vendored HACL* C in experimental_ocaml_glue/hacl_stubs.c;
            # no cryptographic logic in the .ml. Same primitives are
            # realised for js_of_ocaml by hacl_stubs.js over HACL*'s own
            # official wasm build. Permanent fixture (crypto-policy
            # skill), not a retirement candidate. Landed 2026-07-19;
            # allowlist entry missing until 2026-08-26, which is why
            # this gate was red.
            "fstar_hacl_crypto.ml"
            # Rule #11 — a single mutable ref cell with no .fst source,
            # on the same footing as fstar_pure_hashes.ml. It breaks an
            # OCaml link-order cycle that has no F*-side counterpart:
            # SPARQL11_Algebra's patched service_endpoint_lookup needs
            # RML_Eval/SPARQL_HTTP_Client, which are extracted from .fst
            # modules that structurally depend on SPARQL11.Algebra.
            # Issue #57 family; docs/designissues/
            # 2026-07-06-virtual-sources-design.md. Retirement candidate
            # only if that cycle is removed on the F* side. Landed
            # 2026-07-19; allowlist entry missing until 2026-08-26.
            "service_wrap_hook.ml"
            # parquet_probe.ml relocated to bin/parquet-probe/ on
            # 2026-05-08 (#200 PR5). No longer in ocaml-output/.
            # sparql_parser_stubs.ml + sparql-parser-patches.sh REMOVED
            # 2026-07-20 (tools/repo-hygiene.sh dead-code verdict): the
            # escape functions (utf8_of_codepoint/process_iri_escapes/
            # process_string_escapes) are pure F* in SPARQL11.Parser.fst
            # since 2026-05-11 (#64); the stub .ml had no .cmi/.cmx/.o, no
            # link line, and its patch script was never invoked by
            # build-ocaml.sh. Allowlist entry retired with the file.
            # test_fstar_parser.ml retired 2026-05-08 (dead — no references
            # in build scripts; smoke test that was never integrated).
            # factoidal_http_client.ml relocated to bin/factoidal-http-client/
            # on 2026-05-08 (#200 PR5). No longer in ocaml-output/.
          )

          # Build a regex match for the allowlist for quick lookup.
          declare -A allow
          for f in "${ALLOWLIST[@]}"; do
            allow["$f"]=1
          done

          violations=()
          for ml in "$OUTDIR"/*.ml; do
            [ -f "$ml" ] || continue
            base=$(basename "$ml")

            # F\*-extracted files carry `open Prims`, but not always on
            # line 1: a patch script may prepend `include <Module>` lines
            # to merge modules (RDF_Graph_Executable.ml has eight). The
            # old check read line 1 only and reported that extracted file
            # as hand-written for over three weeks.
            #
            # Rule: scan the prologue. `open Prims` counts as extracted
            # when only `include`/`open` lines, blanks and comments
            # precede it. The first line of real code ends the prologue,
            # so a hand-written file cannot smuggle it in halfway down.
            if awk '
              /^[[:space:]]*$/                 { next }
              /^[[:space:]]*\(\*/            { next }
              /^open Prims$/                   { found = 1; exit }
              /^include [A-Z][A-Za-z0-9_]*$/   { next }
              /^open [A-Z][A-Za-z0-9_]*$/      { next }
                                               { exit }
              END { exit !found }
            ' "$ml"; then
              continue
            fi

            # Otherwise, must be on the allowlist.
            if [ -n "${allow[$base]:-}" ]; then
              continue
            fi

            violations+=("$ml")
          done

          if [ "${#violations[@]}" -gt 0 ]; then
            echo "::error::Hand-written .ml in formal/fstar/ocaml-output/ — must be relocated to bin/<consumer>/ per #200 Section D."
            echo ""
            echo "The following files are neither F\*-extracted (no \`open Prims\` first line) nor on the allowlist:"
            for v in "${violations[@]}"; do
              echo "  - $v"
            done
            echo ""
            echo "Per CLAUDE.md iron rule #11, formal/fstar/ocaml-output/ is reserved for"
            echo "F\*-extracted output + assume-val realisations. Hand-written runners and"
            echo "consumer-side glue belong under bin/<consumer>/."
            echo ""
            echo "If a file genuinely needs to live here (e.g. a new assume-val OCaml"
            echo "realisation), add it to the ALLOWLIST in"
            echo ".github/workflows/check-ocaml-output-cleanliness.yml with a one-line"
            echo "comment noting the migration plan."
            exit 1
          fi

          echo "ocaml-output/ cleanliness check passed."
          echo ""
          echo "Inventory:"
          extracted_count=0
          allow_count=0
          for ml in "$OUTDIR"/*.ml; do
            [ -f "$ml" ] || continue
            base=$(basename "$ml")
            if awk '
              /^[[:space:]]*$/                 { next }
              /^[[:space:]]*\(\*/            { next }
              /^open Prims$/                   { found = 1; exit }
              /^include [A-Z][A-Za-z0-9_]*$/   { next }
              /^open [A-Z][A-Za-z0-9_]*$/      { next }
                                               { exit }
              END { exit !found }
            ' "$ml"; then
              extracted_count=$((extracted_count + 1))
            elif [ -n "${allow[$base]:-}" ]; then
              allow_count=$((allow_count + 1))
            fi
          done
          echo "  F\*-extracted modules: $extracted_count"
          echo "  Allowlisted glue:     $allow_count"
