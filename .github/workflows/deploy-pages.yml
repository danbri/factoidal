name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/main]
    paths: [docs/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Eleventy
        working-directory: docs
        run: npm ci
      - name: Build
        working-directory: docs
        run: npx @11ty/eleventy --output=_site
      - name: Check Pages link integrity (advisory)
        # Broken links should not block stats / test-results from
        # publishing — those are independent of design-doc cross-refs.
        # Step is advisory: surfaces broken links as a GitHub workflow
        # annotation but always exits 0 so the deploy proceeds. Run
        # locally for the exact list:
        #   ./tests/local/check_pages_links.sh docs/_site
        continue-on-error: true
        run: |
          if ! ./tests/local/check_pages_links.sh docs/_site; then
            echo "::warning::Broken links present in docs/_site — see step log; deploy continues."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
