name: Deploy to GitHub Pages

on:
  # Since 2026-10-25 the site is built from danbri/factoidal-core main
  # (owner: "keep workflow and page and build from factoidal-core main").
  # This repository keeps the Pages URL https://danbri.github.io/factoidal/.
  push:
    branches: [claude/main]
    paths: [.github/workflows/deploy-pages.yml]
  schedule:
    - cron: '41 */3 * * *'
  repository_dispatch:
    types: [factoidal-core-docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danbri/factoidal-core
          ref: main
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Eleventy (offline, vendored)
        # third_party/eleventy/npm-cache is a vendored npm cache
        # (134 packages, no registry access needed) so the Pages
        # build never depends on npmjs.org being reachable. See
        # third_party/eleventy/README.md.
        run: third_party/eleventy/install.sh docs
      - name: Engine files of the published npm release (same-origin pages)
        # The wasm is not in git (iron rule 9); pages that import
        # /npm/factoidal/ need it. Take it from the published package.
        run: |
          set -euo pipefail
          V=$(npm view @factoidal/core version)
          npm pack "@factoidal/core@$V" --silent
          tar -xzf "factoidal-core-$V.tgz"
          cp package/l4-assets/l4factoidal.* npm/factoidal/l4-assets/
          echo "engine files from @factoidal/core@$V"
      - name: Build
        working-directory: docs
        run: npx @11ty/eleventy --output=_site
      - name: Check Pages link integrity (advisory)
        # Broken links should not block stats / test-results from
        # publishing — those are independent of design-doc cross-refs.
        # Step is advisory: surfaces broken links as a GitHub workflow
        # annotation but always exits 0 so the deploy proceeds. Run
        # locally for the exact list:
        #   ./tests/local/check_pages_links.sh docs/_site
        continue-on-error: true
        run: |
          if ! ./tests/local/check_pages_links.sh docs/_site; then
            echo "::warning::Broken links present in docs/_site — see step log; deploy continues."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
