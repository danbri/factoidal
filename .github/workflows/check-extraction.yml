name: Check F* Extraction

on:
  pull_request:
    paths:
      - 'formal/fstar/*.fst'
      - 'formal/fstar/build-ocaml.sh'
      - 'formal/fstar/ocaml-patches.sh'

permissions:
  contents: read

jobs:
  verify-extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-fstar-${{ runner.os }}-v4
          restore-keys: |
            opam-fstar-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev pkg-config

      - name: Setup opam + F*
        run: |
          if [ ! -d ~/.opam ]; then
            opam init -y --disable-sandboxing
          fi
          # Ensure fstar switch exists
          if ! opam switch list 2>/dev/null | grep -q fstar; then
            opam switch create fstar ocaml-base-compiler.4.14.1
          fi
          eval $(opam env --switch=fstar)
          # Install/upgrade all needed packages
          opam install -y fstar z3 zarith sha digestif ocamlfind
          echo "OPAMSWITCH=fstar" >> $GITHUB_ENV
          # Verify fstar is available
          fstar.exe --version

      - name: Verify + Extract + Compile
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          ./build-ocaml.sh extract
          ./build-ocaml.sh compile
