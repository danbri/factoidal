name: Check F* Extraction

# Runs on PUSH as well as pull_request. The 2026-08-24 extraction drift
# (docs/designissues/2026-08-26-extraction-drift-root-cause.md) reached
# claude/main through three direct pushes with no PR, so a
# pull_request-only gate never fired once. The path filter also now
# covers the glue-patch directories and the extraction output itself:
# the drift was introduced by commits that touched
# experimental_ocaml_glue/*.sh and ocaml-output/*.ml, neither of which
# was in the old filter.
on:
  push:
    paths:
      - 'formal/fstar/*.fst'
      - 'formal/fstar/*.fsti'
      - 'formal/fstar/build-ocaml.sh'
      - 'formal/fstar/ocaml-patches.sh'
      - 'formal/fstar/experimental_ocaml_glue/**'
      - 'formal/fstar/minimal_regrettable_glue_code_each_with_an_open_issue/**'
      - 'formal/fstar/ocaml-output/*.ml'
  pull_request:
    paths:
      - 'formal/fstar/*.fst'
      - 'formal/fstar/*.fsti'
      - 'formal/fstar/build-ocaml.sh'
      - 'formal/fstar/ocaml-patches.sh'
      - 'formal/fstar/experimental_ocaml_glue/**'
      - 'formal/fstar/minimal_regrettable_glue_code_each_with_an_open_issue/**'
      - 'formal/fstar/ocaml-output/*.ml'

permissions:
  contents: read

jobs:
  verify-extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-fstar-${{ runner.os }}-v4
          restore-keys: |
            opam-fstar-${{ runner.os }}-

      # F* per-module verification cache — mirrors w3c-tests.yml's
      # block (#238). Without it this PR gate re-verifies the whole
      # tree cold (the dominant cost of this workflow; ~2h measured
      # locally). Keyed on the hash of all F* sources; restore-keys
      # give partial hits (F*'s .checked invalidation is per-module
      # content-digest, so stale entries for unchanged modules still
      # count).
      - name: Cache F* .checked files
        uses: actions/cache@v4
        with:
          path: formal/fstar/*.fst.checked
          key: fstar-checked-${{ runner.os }}-${{ hashFiles('formal/fstar/*.fst', 'formal/fstar/*.fsti') }}
          restore-keys: |
            fstar-checked-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev pkg-config libzstd-dev

      - name: Setup opam + F*
        run: |
          if [ ! -d ~/.opam ]; then
            opam init -y --disable-sandboxing
          fi
          # Ensure fstar switch exists
          if ! opam switch list 2>/dev/null | grep -q fstar; then
            opam switch create fstar ocaml-base-compiler.4.14.1
          fi
          eval $(opam env --switch=fstar)
          # Install F* and deps (pin z3 to 4.13.3 — F* 2025.12.15 requires exact match)
          opam pin add z3 4.13.3 -y --no-action 2>/dev/null || true
          opam install -y fstar z3.4.13.3 zarith sha digestif ocamlfind uucp
          echo "OPAMSWITCH=fstar" >> $GITHUB_ENV
          # Verify tools are available and correct versions
          fstar.exe --version
          z3 --version

      # The drift check npm-publish.yml runs, moved to every push and PR
      # that touches the extraction inputs or output. Until 2026-08-26
      # this job ran `extract` + `compile` and stopped, so it asserted
      # only that extraction SUCCEEDS -- never that the committed .ml
      # MATCHES it. It ran green through a month of drift for that
      # reason (anti-pattern #28: the audit's reach, before the code).
      - name: Verify + Extract + Compile
        run: |
          eval $(opam env --switch=fstar)
          cd formal/fstar
          ./build-ocaml.sh extract --force-full
          ./build-ocaml.sh compile

      - name: Fail on extraction drift vs the committed OCaml
        run: |
          # Every .ml under ocaml-output must be byte-identical to a
          # fresh extract + patch of this commit's .fst. A diff means the
          # committed output does not derive from the committed source:
          # either a re-extraction was committed without the patch step,
          # or the .ml came from a different toolchain.
          if ! git diff --stat --exit-code -- 'formal/fstar/ocaml-output/*.ml'; then
            echo '::error::extraction drift: committed .ml does not match a fresh extraction of this commit'"'"'s .fst'
            echo 'Fix: eval $(opam env --switch=fstar); cd formal/fstar && ./build-ocaml.sh extract --force-full, then commit the result.'
            exit 1
          fi
