# Family-level manifest (not a runnable suite on its own — see the
# README's "Adding a new suite" note: this file exists purely to carry
# family-wide bookkeeping that doesn't fit any single per-suite
# manifest). The JSON-LD 1.1 family spans 7 suites across the toRdf,
# fromRdf, Expansion, Compaction, Flattening, Framing, and HTML-to-RDF
# algorithms defined by the JSON-LD 1.1 API + Framing specs. All 7 now
# have a runner and a live score (jsonld-tordf, jsonld-fromrdf,
# jsonld-expand, jsonld-compact, jsonld-flatten, jsonld-html,
# jsonld-frame). Framing was vendored 2026-07-22 (from the separate
# w3c/json-ld-framing repo) with a first-cut F* algorithm.
name: JSON-LD 1.1 (family bookkeeping)
spec: https://www.w3.org/TR/json-ld11-api/
runner: none
runner_args: []
manifest: internal
log_path: none
result_path: none
domain: RDF
foundational: false

suites_total: 7

triggers:
  paths: []
  excludes: []

# What's left, in plain language (source: docs/claude-rules/w3c-completeness-ledger.md,
# JSON-LD 1.1 row, 2026-07-10). Counted as failing until measured, per
# the project's completeness ledger — not softened to "skipped".
remaining:
  - "frame suite (Framing Algorithm): first-cut F* algorithm — passes the basic match/embed cases; residual fails are the un-implemented frame features (@explicit, @default, @omitDefault, @embed @always/@never/@link, @reverse, @included, named graphs, value-level matching). See jsonld-frame.yaml."
