# Family-level manifest (not a runnable suite on its own — see the
# README's "Adding a new suite" note: this file exists purely to carry
# family-wide bookkeeping that doesn't fit any single per-suite
# manifest). The JSON-LD 1.1 family spans 7 suites across the toRdf,
# fromRdf, Expansion, Compaction, Flattening, Framing, and HTML-to-RDF
# algorithms defined by the JSON-LD 1.1 API spec. 6 have a runner and a
# live score today (jsonld-tordf, jsonld-fromrdf, jsonld-expand,
# jsonld-compact, jsonld-flatten, jsonld-html). The 7th (Framing) has
# neither a runner NOR vendored tests — see the `remaining` note.
name: JSON-LD 1.1 (family bookkeeping)
spec: https://www.w3.org/TR/json-ld11-api/
runner: none
runner_args: []
manifest: internal
log_path: none
result_path: none
domain: RDF
foundational: false

suites_total: 7

triggers:
  paths: []
  excludes: []

# What's left, in plain language (source: docs/claude-rules/w3c-completeness-ledger.md,
# JSON-LD 1.1 row, 2026-07-10). Counted as failing until measured, per
# the project's completeness ledger — not softened to "skipped".
remaining:
  - "frame suite (Framing Algorithm): NOT vendored in this repo — the W3C framing tests live in the separate json-ld-framing suite, which is not checked out here, and no F* framing algorithm exists yet. So there is nothing to run, not merely a missing runner."
  - "html suite: extraction + Expand/ToRDF wired (jsonld-html.yaml); the 9 CompactTest/FlattenTest-via-HTML entries are skips, and the extractAllScripts array-splice case fails — see jsonld-html.yaml."
