name: VC Data Model 2.0 issuer/verifier HTTP suite (W3C vc-data-model-2.0-test-suite, via shim)
spec: https://w3c.github.io/vc-data-model-2.0-test-suite/
runner: tests/vc20-api/run.sh
runner_args: []
manifest: third_party/testing/vc
result_path: docs/test-results/by-suite/vc20-api.json
domain: VC
foundational: false

# Task #88 (canivc.com community-compatibility integration). Runs the
# ALREADY-vendored w3c/vc-data-model-2.0-test-suite's own mocha
# issuer/verifier test files against bin/vc-api-shim/server.mjs. This
# is a SEPARATE, complementary measurement from vc.yaml's vc_stage1
# suite: vc_stage1 runs the SAME vendored tests/input/*.json fixtures
# directly through VC.Credential.fst's structural checker (bin/vc-runner,
# no HTTP, no signing — 117 pass, 0 fail of 117 scorable). This suite
# instead drives the suite's own conformance/contexts/identifiers/types/
# issuer/credential-subject/validity-period/status/data-schemas/
# verifiable-presentations/envelopes/advanced-concepts/algorithms test
# files as real HTTP issue+verify round trips against the shim.
#
# Baseline (2026-07-10): 22 pass, 37 fail (out of 59). Single dominant
# cause (see gap_summary in the result JSON and the scoping doc): the
# shim performed NO VC Data Model 2.0 structural validation of its own —
# it only implemented Data Integrity eddsa-rdfc-2022 signing/verifying —
# so nearly every failure was a "missing expected rejection of malformed
# input" test (bad credentialStatus/refreshService/credentialSchema/
# termsOfUse/evidence shape, validUntil-before-validFrom, missing
# type/context, malformed VP).
#
# Track A2 (2026-07-12, docs/designissues/2026-07-11-vc-canivc-eecc-plan.md):
# 47 pass, 12 fail (out of 59). Wired a new npm ABI export
# (`vcCheckCredential`, bin/npm-entry/entry_jsoo.ml) to
# VC_Credential.vc_check_from_string and call it from
# bin/vc-api-shim/server.mjs's handleIssue/handleVerify before the
# crypto step — pure wiring, no new F* semantics (rule #11: the shim
# still never reimplements a check, it only maps the F*-verified
# verdict to an HTTP rejection). One narrow shim-side carve-out: a
# document whose first `@context` entry is the legacy VC 1.1 base
# context (https://www.w3.org/2018/credentials/v1) skips the VCDM
# 2.0-specific gate entirely (see checkStructural's comment in
# server.mjs) — needed so the vc-di-eddsa suite's own
# version-agnostic Data Integrity fixture (validVc.json) still issues;
# no vc-data-model-2.0-test-suite fixture uses that context, so this
# cannot mask a real violation here.
#
# Track A3 (2026-07-13): 51 pass, 8 fail (out of 59). Added POST
# /presentations/verify (bin/vc-api-shim/server.mjs's
# handleVerifyPresentation) plus a `vpVerifiers` entry in
# tests/vc20-api/run.sh's generated localConfig.cjs. No new npm ABI
# export was needed — VC_Credential.vc_check_from_string already
# dispatches VC-shaped vs VP-shaped documents internally (see
# VC.Credential.fst's vc_check_document), so the existing
# `vcCheckCredential` export / `checkStructural` helper handles VP
# structural checks unchanged. The route does structural check first,
# then the same eddsa-rdfc-2022 Data Integrity proof verification
# already used for /credentials/verify, applied to the VP's own
# top-level proof (verifySecuredDocument, shared by both routes).
# Remaining 8 fails are two families, neither a wiring gap:
#   - relatedResource digest/id checks (Advanced Concepts, 5 tests) —
#     VC.Credential.fst does not implement this check at all.
#   - 3 VP tests whose fixture embeds a `verifiableCredential`
#     (Verifiable Presentations' "verifiableCredential property MAY be
#     present" / "holder value" tests, and 4.03-contexts.js's
#     `presentation-context-combo1-ok.json` case) — the VCDM v2
#     context defines `verifiableCredential` (and `proof`) with
#     `"@container": "@graph"`, and the shim's JSON-LD/RDF-dataset
#     builder drops that named-graph subtree entirely: canonicalizing
#     a VP with an embedded credential yields ONLY the top-level
#     `type` triple (confirmed by direct testing), so the
#     reconstructed signature input never matches what the real
#     eddsa-rdfc-2022 signer produced and verification spuriously
#     fails. This is a JSON-LD named-graph expansion gap (JSONLD.*),
#     not a VC.Credential.fst structural-check gap — out of scope for
#     a wiring task.

triggers:
  paths:
    - bin/vc-api-shim/**
    - third_party/testing/vc/**
    - third_party/contexts/**
    - tests/vc20-api/**
    - formal/fstar/VC.DataIntegrity.fst
    - formal/fstar/VC.Credential.fst
    - npm/factoidal/index.js
    - npm/factoidal/lib/api.js

  excludes: []

# What's left, in plain language.
remaining:
  - "relatedResource digest/id checks (Advanced Concepts, 5 tests: array-of-strings shape, missing id, duplicate id, missing digest, wrong digest) are not implemented in VC.Credential.fst at all — needs new F* structural-check additions, not shim wiring"
  - "a VerifiablePresentation whose `verifiableCredential` field is populated cannot be cryptographically verified — the JSON-LD/RDF-dataset builder does not expand the VCDM v2 context's `@container: @graph` terms (`verifiableCredential`, `proof`), so canonicalizing such a VP silently drops the embedded-credential subtree and the reconstructed signature input never matches the real signer's bytes (3 tests: 'verifiableCredential property MAY be present', 'holder value must be URL or object', and the @context combo1 VP case)"
