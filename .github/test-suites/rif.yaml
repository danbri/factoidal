name: RIF Core (vendored W3C RIF test cases + full Core dialect corpus)
spec: https://www.w3.org/TR/rif-core/
runner: bin/linux-x86_64/rif_runner
runner_args: []
manifest: third_party/testing/w3c/sparql/sparql11/entailment/manifest.ttl
log_path: formal/fstar/ocaml-output/rif_results.log
result_path: docs/test-results/by-suite/rif.json
domain: RIF
foundational: false

# Standalone runner (bin/rif-runner/rif_runner.ml), two parts:
#
# Part 1 (original): exactly the 4 vendored RIF Core test cases the
# SPARQL 1.1 entailment manifest names under sd:entailmentRegime
# ent:RIF (:rif01 :rif03 :rif04 :rif06 -- see manifest above). A
# hardcoded 4-entry lookup table (not a general manifest walker, per
# this suite's own scoping) maps each mf:name to its
# third_party/testing/rif/tc/<TestName>/*.rif rule document, qt:data
# .ttl, qt:query .rq, and mf:result .srx. Pipeline:
# Parser_RIFXML.parse_rif_program_with_imports -> merge the .ttl
# premise with any resolved <Import> companion .rdf graph (with
# OWL-Direct closure applied first when the import's own <profile>
# declares it, e.g. Modeling_Brain_Anatomy) -> RIF_Core_Eval.fixpoint
# (fuel 100) -> the SAME SPARQL11_Parser / OWL_QueryEval /
# SPARQL11_Algebra evaluator every other W3C-conformance runner in
# this repo uses (not RIF.Core.Tests' simplified triple-membership
# shims). Score: 4 pass, 0 fail (out of 4), measured 2026-07-05.
#
# Part 2 (corpus walker, added 2026-07-05): a directory walker over
# the full vendored W3C RIF Core dialect corpus
# (third_party/testing/rif-core-suite/Core_v1.22/Approved/*, 46
# tests -- see that directory's README.md for source/license/
# inventory, and bin/rif-runner/README.md for the pipeline and full
# skip-bucket table). Each PositiveEntailmentTest/NegativeEntailmentTest
# is self-contained (-premise.rif + -conclusion.rif/-nonconclusion.rif,
# no SPARQL manifest needed): saturate the premise via the same
# RIF_Core_Eval.fixpoint (now also evaluating External(...)/Equal body
# conditions via new module RIF.Core.Builtins.fst -- a bounded RIF-DTB
# builtin subset: the numeric function/predicate family,
# literal-not-identical, is-literal-<T>/is-literal-not-<T> for a fixed
# datatype list, and XSD/rdf constructor-function casts targeting
# those datatypes), translate the conclusion's fact(s) to a BGP via
# RIF_Core_Translation.translate_atom, ASK it against the saturated
# graph via the same OWL_QueryEval.eval_ask_query_owl.
# PositiveSyntaxTest/NegativeSyntaxTest (RIF Core dialect safeness +
# "no free variables") are checked via new module
# RIF.Core.Conformance.fst's structural analysis over the raw RIF-XML
# tree; ImportRejectionTest dispatches per fixture to the specific
# RIF-RDF/OWL combination-spec import-validity condition it exercises
# (same module, §5) -- one fixture (Multiple_Context_Error,
# cross-document constant-role tracking) remains an honest SKIP.
#
# Score, measured 2026-07-05 (External/safeness/import-rejection
# buckets landed): 30 pass, 4 fail, 12 skip (out of 46) -- up from the
# initial-landing 9 pass, 1 fail, 36 skip. Per-bucket before/after
# (skip-bucket counts from bin/rif-runner/README.md's original table):
#   - 16 External skips -> 9 now PASS (numeric family + binary/anyURI/
#     boolean/XMLLiteral is-literal-<T> + literal-not-identical +
#     Chaining_strategy_* builtin-function chaining +
#     Guards_and_subtypes via the And-of-facts conclusion parse fix),
#     6 remain honest skips each naming the unimplemented feature
#     (String / Time+dateTime x2 / PlainLiteral builtin families,
#     Builtins_List -> List builtins, IRI_from_RDF_Literal -> Exists +
#     pred:iri-string binding-pattern execution), 1
#     (Factorial_Forward_Chaining) is a labelled KNOWN-GAP FAIL
#     (arity-2 Uniterm body re-binding needs real n-ary reification,
#     not attempted).
#   - 6 syntax-safeness skips -> all 6 now PASS via RIF.Core.Conformance.
#   - 6 import-rejection skips -> 5 now PASS, 1 honest skip
#     (Multiple_Context_Error).
#   - 3 Uniterm-arity skips -> 1 now PASS (Positional_Arguments), 2 are
#     labelled KNOWN-GAP FAILs (Local_Constant/Local_Predicate --
#     rif:local constants are not document-scoped in this engine).
#   - 2 Equal skips -> still SKIP but now with a precise reason: the
#     Vocabulary_Separation_Inconsistency fixtures' "a"="b" conclusion
#     is entailed only via an INCONSISTENT premise combination
#     (OWL-Direct individual/data-value vocabulary-separation
#     violation); combination-inconsistency detection not implemented.
#   - List/Exists buckets (2 tests) unchanged SKIP.
# The pre-existing RDF_Combination_Constant_Equivalence_4 KNOWN-DEFECT
# FAIL (corpus data defect, not an engine gap) is unchanged.
#
# Combined score: 34 pass, 4 fail, 12 skip (out of 50) -- up from
# 13 pass, 1 fail, 36 skip. Every remaining skip names the specific
# unimplemented feature or corpus packaging gap. The runner exits 1
# whenever the combined fail count is nonzero (rif_runner.ml main's
# `if grand_fail > 0 then exit 1`) -- CI consumers of this suite's
# exit code should expect nonzero until the 4 labelled FAILs above are
# addressed (1 corpus defect, not fixable here; 3 labelled engine
# KNOWN-GAPs, see bin/rif-runner/README.md's Score section for each).
#
# See bin/rif-runner/rif_runner.ml's header comment,
# formal/fstar/RIF.Core.Builtins.fst's module comment, and
# docs/claude-rules/scope.md's RIF paragraph for the up-to-date
# supported-subset statement (RIF Core frames/BGP-shaped rule bodies +
# the bounded RIF-DTB builtin subset + safeness/import-rejection
# conformance checking; RIF-BLD/PRD's full builtin library, List
# terms, and Exists remain out of scope).

triggers:
  paths:
    # RIF-XML parsing + rule evaluation (all F*-extracted).
    - formal/fstar/Parser.RIFXML.fst
    - formal/fstar/RIF.Core.Syntax.fst
    - formal/fstar/RIF.Core.Translation.fst
    - formal/fstar/RIF.Core.Eval.fst
    # RIF-DTB builtin subset (External/Equal body-condition
    # evaluation) and RIF Core dialect conformance checking
    # (safeness + free-variables + import-rejection), added
    # 2026-07-05.
    - formal/fstar/RIF.Core.Builtins.fst
    - formal/fstar/RIF.Core.Conformance.fst
    - formal/fstar/XSD.Datatypes.fst
    # The BGP evaluator RIF_Core_Eval.fire_rule delegates to for rule
    # bodies, and the OWL-Direct/RDFS closure paths this runner
    # reuses for imports (e.g. Modeling_Brain_Anatomy, and Part 2's
    # RDF_Combination_SubClass_2/etc.).
    - formal/fstar/SPARQL11.Algebra.fst
    - formal/fstar/RDF.Graph.Executable.fst
    - formal/fstar/Tableau.fst
    # OWL 2 Direct Semantics ontology-annotation-triple exclusion,
    # applied to the imported companion graph before OWL-Direct
    # closure (see the Non-Annotation_Entailment diagnosis above).
    - formal/fstar/OWL.DirectMapping.Filter.fst
    # The real SPARQL query parser + evaluator this runner drives the
    # .rq files (Part 1) and the synthetic conclusion-BGP ASK queries
    # (Part 2) through.
    - formal/fstar/SPARQL11.Parser.fst
    - formal/fstar/OWL.QueryRewrite.fst
    - formal/fstar/OWL.QueryEval.fst
    # The runner itself.
    - bin/rif-runner/**
    # Vendored RIF Test Cases mirror + the 4 rifNN.{ttl,rq,srx}
    # fixtures under the SPARQL 1.1 entailment manifest (Part 1).
    - third_party/testing/rif/tc/**
    - third_party/testing/w3c/sparql/sparql11/entailment/rif01.*
    - third_party/testing/w3c/sparql/sparql11/entailment/rif03.*
    - third_party/testing/w3c/sparql/sparql11/entailment/rif04.*
    - third_party/testing/w3c/sparql/sparql11/entailment/rif06.*
    # Vendored W3C RIF Core dialect corpus (Part 2).
    - third_party/testing/rif-core-suite/**

  excludes: []
