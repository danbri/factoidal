name: RIF Core (vendored W3C RIF test cases + full Core dialect corpus)
spec: https://www.w3.org/TR/rif-core/
runner: bin/linux-x86_64/rif_runner
runner_args: []
manifest: third_party/testing/w3c/sparql/sparql11/entailment/manifest.ttl
log_path: formal/fstar/ocaml-output/rif_results.log
result_path: docs/test-results/by-suite/rif.json
domain: RIF
foundational: false

# Standalone runner (bin/rif-runner/rif_runner.ml), two parts:
#
# Part 1 (original): exactly the 4 vendored RIF Core test cases the
# SPARQL 1.1 entailment manifest names under sd:entailmentRegime
# ent:RIF (:rif01 :rif03 :rif04 :rif06 -- see manifest above). A
# hardcoded 4-entry lookup table (not a general manifest walker, per
# this suite's own scoping) maps each mf:name to its
# third_party/testing/rif/tc/<TestName>/*.rif rule document, qt:data
# .ttl, qt:query .rq, and mf:result .srx. Pipeline:
# Parser_RIFXML.parse_rif_program_with_imports -> merge the .ttl
# premise with any resolved <Import> companion .rdf graph (with
# OWL-Direct closure applied first when the import's own <profile>
# declares it, e.g. Modeling_Brain_Anatomy) -> RIF_Core_Eval.fixpoint
# (fuel 100) -> the SAME SPARQL11_Parser / OWL_QueryEval /
# SPARQL11_Algebra evaluator every other W3C-conformance runner in
# this repo uses (not RIF.Core.Tests' simplified triple-membership
# shims). Score: 4 pass, 0 fail (out of 4), measured 2026-07-05.
#
# Part 2 (corpus walker, added 2026-07-05): a directory walker over
# the full vendored W3C RIF Core dialect corpus
# (third_party/testing/rif-core-suite/Core_v1.22/Approved/*, 46
# tests -- see that directory's README.md for source/license/
# inventory, and bin/rif-runner/README.md for the pipeline and full
# disposition table). Each PositiveEntailmentTest/NegativeEntailmentTest
# is self-contained (-premise.rif + -conclusion.rif/-nonconclusion.rif,
# no SPARQL manifest needed): saturate the premise via the same
# RIF_Core_Eval.fixpoint, translate the conclusion's fact(s) to a BGP
# via RIF_Core_Translation.translate_atoms_bgp, ASK it against the
# saturated graph via the same OWL_QueryEval.eval_ask_query_owl.
# PositiveSyntaxTest/NegativeSyntaxTest (safeness + "no free
# variables") and ImportRejectionTest (per-fixture import-validity
# dispatch, including Multiple_Context_Error's cross-document
# constant-role tracking) are checked via RIF.Core.Conformance.fst.
#
# Score, measured 2026-07-10 (tail-burndown wave): 42 pass, 1 fail,
# 3 skip (out of 46) -- up from 30 pass, 4 fail, 12 skip on
# 2026-07-05. What landed in the 2026-07-10 wave (all in F* except
# runner dispatch):
#   - RIF-DTB STRING builtin family (compare/concat/string-join/
#     substring/string-length/upper-case/lower-case/encode-for-uri/
#     iri-to-uri/escape-html-uri/substring-before/-after/replace,
#     contains/starts-with/ends-with/matches, value-space
#     is-literal-<T> for the xsd:string-derived datatypes) ->
#     Builtins_String passes.
#   - rdf:PlainLiteral builtin family over the decoded
#     xsd:string/rdf:langString form -> Builtins_PlainLiteral passes.
#   - dateTime slice (is-literal-dateTime, subtract-dateTimes,
#     days-from-duration) -> EBusiness_Contract passes.
#   - pred:iri-string binding-pattern EXECUTION (produce an IRI from
#     a bound string or vice versa) + <Exists>-quantified conclusions
#     -> IRI_from_RDF_Literal and RDF_Combination_Blank_Node pass.
#   - Uniterm argument-value satellites + n-ary (arity >= 3)
#     reification (RIF.Core.Translation section 1c) ->
#     Factorial_Forward_Chaining passes (was a KNOWN-GAP fail).
#   - rif:local constants are now DOCUMENT-SCOPED
#     (Parser.RIFXML.scope_local_constants; premise and conclusion
#     parse under different scopes) -> Local_Constant and
#     Local_Predicate pass (were KNOWN-GAP fails).
#   - OWL-Direct vocabulary-separation inconsistency detection
#     (RIF.Core.Conformance section 6; an inconsistent combination
#     entails everything) -> both
#     OWL_Combination_Vocabulary_Separation_Inconsistency fixtures pass.
#   - Cross-document constant-role tracking over the raw RIF-XML
#     trees (multiple_context_violation_xml) -> Multiple_Context_Error
#     passes.
#   - RDF_Combination_Constant_Equivalence_Graph_Entailment's
#     conclusion is an RDF GRAPH (never shipped in the zip; conclusion
#     Turtle vendored from the archived W3C wiki with PROVENANCE.md)
#     and the runner evaluates graph-entailment conclusions -> passes.
#
# Combined score: 46 pass, 1 fail, 3 skip (out of 50) -- up from
# 34 pass, 4 fail, 12 skip. Dispositions of the 4 non-passes:
#   - FAIL RDF_Combination_Constant_Equivalence_4: data defect in the
#     official corpus itself (malformed xsd:string datatype IRI,
#     present in both the Core_v1.22.zip and the archived
#     authoritative wiki source) -- not fixable without breaking
#     correct datatype-IRI semantics.
#   - SKIP Builtins_List + NestedListsAreNotFlatLists: RIF List terms
#     are not modelled in RIF.Core.Syntax.
#   - SKIP Builtins_Time: the full date/time/duration builtin family
#     (~60 builtins; only the EBusiness_Contract slice is
#     implemented) -- the skip names the first unimplemented builtin.
# The runner exits 1 whenever the combined fail count is nonzero; CI
# consumers should expect exit 1 while the corpus-defect FAIL stands
# (the W3C RIF wiki is archived read-only, so no upstream fix is
# coming).
#
# See bin/rif-runner/rif_runner.ml's header comment,
# formal/fstar/RIF.Core.Builtins.fst's module comment, and
# docs/claude-rules/scope.md's RIF paragraph for the up-to-date
# supported-subset statement (List terms and the full date/time/
# duration builtin family remain out of scope).

triggers:
  paths:
    # RIF-XML parsing + rule evaluation (all F*-extracted).
    - formal/fstar/Parser.RIFXML.fst
    - formal/fstar/RIF.Core.Syntax.fst
    - formal/fstar/RIF.Core.Translation.fst
    - formal/fstar/RIF.Core.Eval.fst
    # RIF-DTB builtin subset (External/Equal body-condition
    # evaluation) and RIF Core dialect conformance checking
    # (safeness + free-variables + import-rejection), added
    # 2026-07-05.
    - formal/fstar/RIF.Core.Builtins.fst
    - formal/fstar/RIF.Core.Conformance.fst
    - formal/fstar/XSD.Datatypes.fst
    # The BGP evaluator RIF_Core_Eval.fire_rule delegates to for rule
    # bodies, and the OWL-Direct/RDFS closure paths this runner
    # reuses for imports (e.g. Modeling_Brain_Anatomy, and Part 2's
    # RDF_Combination_SubClass_2/etc.).
    - formal/fstar/SPARQL11.Algebra.fst
    - formal/fstar/RDF.Graph.Executable.fst
    - formal/fstar/Tableau.fst
    # OWL 2 Direct Semantics ontology-annotation-triple exclusion,
    # applied to the imported companion graph before OWL-Direct
    # closure (see the Non-Annotation_Entailment diagnosis above).
    - formal/fstar/OWL.DirectMapping.Filter.fst
    # The real SPARQL query parser + evaluator this runner drives the
    # .rq files (Part 1) and the synthetic conclusion-BGP ASK queries
    # (Part 2) through.
    - formal/fstar/SPARQL11.Parser.fst
    - formal/fstar/OWL.QueryRewrite.fst
    - formal/fstar/OWL.QueryEval.fst
    # The runner itself.
    - bin/rif-runner/**
    # Vendored RIF Test Cases mirror + the 4 rifNN.{ttl,rq,srx}
    # fixtures under the SPARQL 1.1 entailment manifest (Part 1).
    - third_party/testing/rif/tc/**
    - third_party/testing/w3c/sparql/sparql11/entailment/rif01.*
    - third_party/testing/w3c/sparql/sparql11/entailment/rif03.*
    - third_party/testing/w3c/sparql/sparql11/entailment/rif04.*
    - third_party/testing/w3c/sparql/sparql11/entailment/rif06.*
    # Vendored W3C RIF Core dialect corpus (Part 2).
    - third_party/testing/rif-core-suite/**

  excludes: []

# What's left, in plain language (source: docs/claude-rules/w3c-completeness-ledger.md,
# RIF Core row, 2026-07-10; and bin/rif-runner/README.md's Score section).
remaining:
  - "1 known-gap fail: a rule whose body re-binds an arity-2 predicate needs real n-ary reification, not attempted"
  - "2 known-gap fails: rif:local constants are not scoped per-document in this engine"
  - "1 fail is a defect in the vendored corpus data itself (a malformed xsd:string IRI), not an engine bug"
  - "6 skips: the String, Time+dateTime, and PlainLiteral builtin families, plus List-term builtins, are not implemented"
  - "2 skips: Exists-quantified rule bodies (existential variables in RIF Core) are not implemented"
  - "1 skip: detecting that a premise combination is internally inconsistent (needed for one vocabulary-separation fixture) is not implemented"
  - "1 skip: cross-document constant-role tracking for one import-rejection fixture (Multiple_Context_Error) is not implemented"
