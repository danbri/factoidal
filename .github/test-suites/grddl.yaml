name: GRDDL Stage 2 (local docroot)
spec: https://www.w3.org/TR/grddl/
runner: bin/linux-x86_64/grddl_runner
runner_args: []
manifest: internal
log_path: formal/fstar/ocaml-output/grddl_results.log
result_path: docs/test-results/by-suite/grddl.json
domain: RDF
foundational: false

# Stage 2 of the GRDDL program (issue #301,
# docs/designissues/2026-07-08-grddl-scoping.md): same-document discovery
# (paths a+b) PLUS namespace-document (§3) and profile-document (§5)
# transformation discovery, all in F* (GRDDL.Discovery). Every manifest
# test is now RUN against the vendored docroot -- no blanket skip by
# manifest type; the runner fetches referenced second documents from the
# local allowlist (no live network). See generate-report.sh's GRDDL family
# section for the current pass/fail/skip counts.
triggers:
  paths:
    - formal/fstar/GRDDL.Discovery.fst
    - formal/fstar/XSLT.Transform.fst
    - formal/fstar/XPath.Eval.fst
    - bin/grddl-runner/**
    - third_party/testing/grddl/**
  excludes: []

# What's left, in plain language (source: docs/claude-rules/w3c-completeness-ledger.md,
# GRDDL row, 2026-07-10).
remaining:
  - "30 fail-graph-mismatch: consumed XSLT-engine fidelity gaps (e.g. grokSheet.xsl Gnumeric, hcard2rdf.xsl), HTTP content-negotiation (langconneg/multipleRepresentations), namespace-transformation recursion+merge, and XInclude posture — engine bugs are reported, not fixed in the GRDDL layer"
  - "6 fail-known-gap-xslt-feature: inline-rdf xml:base/xml:lang handling in embeddedRDF.xsl"
  - "10 fail-no-transformation-discovered: namespace/profile-document tests whose SECOND document is not vendored offline (two/three/four-transforms, ns-*, sq1/sq2)"
  - "7 fail-transform-not-vendored: a discovered stylesheet (.sxsl, or a redirect-base path) is not present in the offline docroot"
  - "Recursion + loop-detection (loop/loopx/ns-* chains) is single-level only; HTTP redirect-base and content-negotiation are not simulated; Stage 3 (HTML tag-soup input) is not implemented"
