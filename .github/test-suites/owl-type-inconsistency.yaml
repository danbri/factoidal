name: OWL 2 DL Type Inconsistency (type-inconsistency)
spec: https://www.w3.org/TR/owl2-test/
runner: bin/linux-x86_64/owl_runner
runner_args:
  - third_party/testing/owl/type-inconsistency.rdf
  - --regime
  - dl
log_path: formal/fstar/ocaml-output/owl_type_inconsistency_results.log
result_path: docs/test-results/by-suite/owl-type-inconsistency.json
domain: OWL
foundational: false

# OWL 2 DL InconsistencyTest catalog, scored under the DL regime. The
# generate-report.sh --run loop's own table records RL 34 pass / 83
# fail -> DL 36 pass / 81 fail (+2 sound) for this catalog. Beyond the
# verified tableau refuter (Tableau.Refute) and the verified class-size
# unsat check (Tableau.CountingOracle.class_size_unsat, a proven Farkas-
# certificate result), a small number of cases can additionally be
# flipped by a native z3 counting-fragment oracle
# (Tableau_CountingOracle.z3_check_sat) — that path is gated to
# InconsistencyTests only (never Consistency) so it can flip zero
# consistency tests by construction, and is reported separately as
# "oracle-assisted" rather than folded into the pure-verified pass
# count (see owl_runner.ml's z3_oracle_refutes header comment and
# docs/designissues/2026-07-14-z3-entailment-backend.md).

triggers:
  paths:
    # Closure rules + Horn dispatch.
    - formal/fstar/RDF.Graph.Executable.fst
    # Shared OWL/RDF vocabulary IRIs.
    - formal/fstar/OWL.Vocabulary.fst
    # RL/RDF closure rule table.
    - formal/fstar/OWL.Closure.fst
    # DL tableau materialisation + refutation (regime=dl), incl. the
    # verified class-size / z3-oracle-assisted inconsistency checks.
    - formal/fstar/Tableau.fst
    - formal/fstar/Tableau.Refute.fst
    - formal/fstar/Tableau.CountingOracle.fst
    # Catalog parser (RDF/XML) + the OWL Functional-Syntax premise path.
    - formal/fstar/Parser.RDFXML.fst
    - formal/fstar/Parser.XML.fst
    - formal/fstar/Parser.OWLFunctional.fst
    # The runner.
    - bin/owl-runner/**

  excludes: []

# What's left, in plain language (source: docs/claude-rules/w3c-completeness-ledger.md,
# OWL 2 row, 2026-07-10; see also owl-profile-rl.yaml's `remaining` for
# the family-wide caveats).
remaining:
  - "1 residual fail (2026-07-29, 126 pass, 1 fail out of 127): dl-909's nonemptiness is soundly underivable from its class-size system (Tableau.CountingOracle.fst section-8 banner + docs/designissues/2026-07-28-tableau-classification-design.md). dl-502 was refuted by the 2026-07-28 nominal-branching wave; 'Minus Infinity is not in owl:real' by the 2026-07-29 XSD value-space decision procedure (docs/designissues/2026-07-29-xsd-value-space-decision-procedure.md)"
  - "z3-oracle-assisted passes are counted OUTSIDE the pure-verified tally and reported separately, since they depend on an unverified z3 call rather than the F*-proven tableau/counting-oracle path"
