name: ShEx (Shape Expressions) Validation
spec: https://shex.io/shex-semantics/
runner: bin/linux-x86_64/shex_runner
runner_args: []
manifest: third_party/testing/shex/validation/manifest.ttl
log_path: formal/fstar/ocaml-output/shex_results.log
result_path: docs/test-results/by-suite/shex.json
domain: SHEX
foundational: false

# Stage 8 of the ShEx program
# (docs/designissues/2026-07-05-shex-program-plan.md), following stage 3
# (commit 37ae500: triple-expression matching, disjoint-predicate fast
# path). ShExJ-first (the vendored corpus's canonical ShExC `.shex`
# schema references are swapped for their same-basename `.json` twin —
# see bin/shex-runner/shex_runner.ml's header for the mapping). As of
# the 2026-07-05 SKIP-elimination pass the runner also handles:
#   - manifest-only shape maps (`sht:trait sht:ShapeMap` fixtures using
#     `sht:map`/JSON-per-entry `mf:result` instead of a single
#     `sht:focus`/`sht:shape`/boolean verdict) — parsed via the
#     F*-extracted Parser_JSON, each map entry validated separately and
#     checked against its own expected per-entry result;
#   - the 3 schemas (extends-abstract-multi-empty, extends-closed-
#     diamond, extends-closed-3diamond-split — 23 fixtures) that are
#     genuinely ShExC-only upstream (checked against shexSpec/shexTest
#     master, not just a stale pin): hand-translated ShExJ twins live
#     in tests/shex-shexj-twins/ (NOT the submodule), with provenance
#     documented in that directory's README. The runner falls back
#     there only when the submodule has no twin for a schema.
# 0 schemas now lack any twin; 0 fixtures SKIP for "no sht:focus".
# Logic-conformant only (boolean pass/fail, no ValidationResult/error-
# report structure matching — the suite's own README calls those tiers
# experimental).
#
# The runner reports FOUR buckets, not two: PASS / MISMATCH (a real
# wrong verdict) / DEFERRED (ShEx.Validation.validate_focus returned
# `None` — Stage 4/5 territory: TE_OneOf, cardinality-wrapped groups,
# overlapping-signature siblings, shapeExprRef recursion, fuel
# exhaustion, or — as of the extends twins above — Stage 6 `extends`/
# `abstract` semantics not yet landed in ShEx.Validation.fst) / SKIP
# (couldn't even be attempted — missing data/schema file on disk, a
# decode exception). DEFERRED is an honest scope gap, not a wrong
# answer — see ShEx.Validation.fst's file-header doc comment for the
# `option bool` convention this bucketing mirrors.
#
# Runner-side remainder (commit cc12399's triage; baseline 1115 pass,
# 42 mismatch, 25 deferred, 0 skipped): the runner now (1) parses each
# sht:data fixture against the manifest's resolved github-raw base
# instead of file:// (fixed 25 of the 42 mismatches — a relative
# sht:focus term and the data file's own relative IRIs were resolving
# to two different absolute IRIs); (2) resolves top-level ShExJ
# `"imports"` (recursive, cycle-safe shape-list merge — see
# bin/shex-runner/shex_runner.ml's "imports" section) — this took 17
# of the 25 deferred fixtures to PASS but surfaced 1 new MISMATCH,
# `start2RefS1-IstartS2`: the vendored twin
# third_party/testing/shex/schemas/start2RefS2.json has predicate
# `p1` where the canonical `start2RefS2.shex` has `p2` — a pre-
# existing upstream/submodule data bug, not a runner or decoder bug,
# left as an honest MISMATCH rather than silently patched around;
# (3) merges `sht:shapeExterns` `.shextern` fixtures into
# `SE_ShapeExternal` placeholders (hand-translated ShExJ twin, only
# one `.shextern` file in the whole corpus — see
# tests/shex-shexj-twins/README.md) — fixed all 4 shapeExtern_*/
# shapeExternRef_* fixtures; (4) accepts blank-node `sht:shape`
# labels, not just IRIs; (5) resolves schema-internal relative IRIs
# against the schema's own document IRI at decode time
# (ShEx.Schema.fst's decode_schema/decode_shex_schema now take a
# `base` parameter, threaded through the whole ShExJ decoder via
# Parser.IRI.resolve_iri_v2 — with a blank-node-label guard and a
# stem `kind` gate so LiteralStem/LanguageStem stems and bnode ids are
# never treated as IRIs). (4)+(5) fixed the remaining 4 deferred
# (bnode1dot_pass/fail, 1dot-relative_pass-short-shape/relative-shape).
# Current: 1164 pass, 18 mismatch, 0 deferred, 0 skipped (out of
# 1182) — up from 1026 pass, 11 mismatch, 145 deferred, 0 skipped.

triggers:
  paths:
    # ShExJ AST + JSON decoder.
    - formal/fstar/ShEx.Schema.fst
    # NodeConstraint dispatch + triple-expression partition matching.
    - formal/fstar/ShEx.Validation.fst
    # The manifest itself, and schema/data fixtures, are plain Turtle.
    - formal/fstar/Parser.Turtle.fst
    # ShExJ schema fixtures are JSON.
    - formal/fstar/Parser.JSON.fst
    # Reused datatype-level arithmetic (literal_to_scaled / scaled_cmp /
    # literal_ill_formed) — the same functions SHACL.Validation.fst calls.
    - formal/fstar/XSD.Datatypes.fst
    # `pattern` facet reuses SPARQL11.Algebra.regex_match (assume-val
    # host-engine call-out, rule #11's acceptable form).
    - formal/fstar/SPARQL11.Algebra.fst
    - formal/fstar/minimal_regrettable_glue_code_each_with_an_open_issue/63_regex_hash_uuid_stubs.sh
    # The runner.
    - bin/shex-runner/**
    # Vendored shexSpec/shexTest (manifest + validation/*.ttl +
    # schemas/*.json fixtures).
    - third_party/testing/shex/**
    # Hand-translated ShExJ twins for the schemas that are genuinely
    # ShExC-only upstream (see that directory's README for provenance).
    - tests/shex-shexj-twins/**

  excludes: []
