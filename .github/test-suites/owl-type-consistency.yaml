name: OWL 2 DL Type Consistency (type-consistency)
spec: https://www.w3.org/TR/owl2-test/
runner: bin/linux-x86_64/owl_runner
runner_args:
  - third_party/testing/owl/type-consistency.rdf
  - --regime
  - dl
log_path: formal/fstar/ocaml-output/owl_type_consistency_results.log
result_path: docs/test-results/by-suite/owl-type-consistency.json
domain: OWL
foundational: false

# OWL 2 DL ConsistencyTest catalog, scored under the DL regime (RL
# closure -> Tableau.tableau_materialise -> RL closure). generate-
# report.sh's own per-catalog comment notes Tableau adds no unsound
# inconsistency on this catalog. This is the heaviest of the seven
# catalogs (7200s budget in generate-report.sh --run) — some WebOnt
# description-logic premises produce closures large enough that the
# per-test SIGALRM cap (and the separate, smaller refuter cap) matter
# for keeping the whole catalog from hanging.

triggers:
  paths:
    # Closure rules + Horn dispatch.
    - formal/fstar/RDF.Graph.Executable.fst
    # Shared OWL/RDF vocabulary IRIs.
    - formal/fstar/OWL.Vocabulary.fst
    # RL/RDF closure rule table.
    - formal/fstar/OWL.Closure.fst
    # DL tableau materialisation + refutation (regime=dl).
    - formal/fstar/Tableau.fst
    - formal/fstar/Tableau.Refute.fst
    - formal/fstar/Tableau.CountingOracle.fst
    # Catalog parser (RDF/XML) + the OWL Functional-Syntax premise path.
    - formal/fstar/Parser.RDFXML.fst
    - formal/fstar/Parser.XML.fst
    - formal/fstar/Parser.OWLFunctional.fst
    # The runner.
    - bin/owl-runner/**

  excludes: []

# What's left, in plain language (source: docs/claude-rules/w3c-completeness-ledger.md,
# OWL 2 row, 2026-07-10; see also owl-profile-rl.yaml's `remaining` for
# the family-wide caveats).
remaining:
  - "15 of the 352 ConsistencyTests trip a per-test CPU budget during closure, marker scan or refutation and score `unsupported` rather than PASS (#326, 2026-07-30): a ConsistencyTest passes on the ABSENCE of a clash, so a pass earned by abandoning the search is not evidence — 337 pass, 15 fail (out of 352) where the same run scored 352 pass, 0 fail before the gate. All 15 are named on /web/conformance/owl2/. A performance gap, not a soundness gap, but no longer counted as a pass"
  - "the closure-stage escapes among those 15 are the owl:sameAs closure blow-up of #262; raising the cap 3x and 9x on the profile-EL instance (WebOnt-Thing-004) recovered nothing and cost proportional wall time, so the fix belongs in the closure"
