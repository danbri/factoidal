name: DID did:key
spec: https://www.w3.org/TR/did-core/
runner: bin/linux-x86_64/did_runner
runner_args: []
manifest: internal
log_path: formal/fstar/ocaml-output/did_results.log
result_path: docs/test-results/by-suite/did.json
domain: RDF
foundational: false

# did:key resolution + multibase/multicodec accept/reject cases.
triggers:
  paths:
    - bin/did-runner/**
    - third_party/testing/did/**
  excludes: []

# What's left, in plain language (source: docs/claude-rules/w3c-completeness-ledger.md,
# DID row, 2026-07-10).
remaining:
  - "this suite covers only did:key — did:web (or any other DID method) is not implemented"
  - "DID resolution metadata is not produced — a full DID Core conformance target still needs to be enumerated, not just did:key vectors"
  - "assessed against the official w3c-ccg/did-key-test-suite (task #88, 2026-07-10) and not implemented: it is a resolver-conformance suite (GET /didResolvers/<did> returning a full DID Resolution Result envelope with didDocument/didDocumentMetadata/didResolutionMetadata and structured error codes) rather than the vector-accept/reject shape this suite covers; didKeyResolve's npm export returns bare RDF, not that envelope. See docs/designissues/2026-07-10-canivc-community-compat.md's did:key section for the specific gap."
