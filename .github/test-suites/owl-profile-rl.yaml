name: OWL 2 Profile RL Conformance
spec: https://www.w3.org/TR/owl2-profiles/#OWL_2_RL
runner: bin/linux-x86_64/owl_runner
runner_args:
  - third_party/testing/owl/profile-RL.rdf
log_path: formal/fstar/ocaml-output/owl_results.log
result_path: docs/test-results/by-suite/owl-profile-rl.json
domain: OWL
foundational: false

# OWL 2 RL profile conformance via the standalone owl_runner. The RL
# profile is the rule-based subset that maps directly onto Horn rules
# in RDF.Graph.Executable's owl_rl_closure_step.

triggers:
  paths:
    # Closure rules + Horn dispatch.
    - formal/fstar/RDF.Graph.Executable.fst
    # Shared OWL/RDF vocabulary IRIs.
    - formal/fstar/OWL.Vocabulary.fst
    # Catalog parser (RDF/XML).
    - formal/fstar/Parser.RDFXML.fst
    - formal/fstar/Parser.XML.fst
    # The runner.
    - bin/owl-runner/**

  excludes: []

# What's left, in plain language (source: docs/claude-rules/w3c-completeness-ledger.md,
# OWL 2 row, 2026-07-10). Covers the whole OWL 2 family (profile-RL plus
# the other catalogs scored alongside it on the dashboard), not just
# this one manifest.
remaining:
  - "the DL entailment catalogs (EL, QL, and the general DL profile) are only partially wired to the tableau reasoner — some fail because the parser doesn't yet cover OWL Functional-Style Syntax fixtures, and some fail because the reasoner materialises entailments but doesn't yet refute the negative (inconsistency) side"
  - "the syntax-dl structural checker (validating that an ontology stays inside the OWL 2 DL syntactic profile) is not implemented, so that catalog is not scored at all"
  - "large graphs using owl:sameAs extensively can hit a performance blowup during closure computation — a known scaling gap, not a correctness gap"
