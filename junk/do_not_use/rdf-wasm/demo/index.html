<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDF-WASM Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a; color: #e2e8f0;
      max-width: 900px; margin: 0 auto; padding: 2rem;
    }
    h1 { color: #38bdf8; margin-bottom: 0.5rem; }
    h2 { color: #94a3b8; font-size: 1rem; margin: 1.5rem 0 0.5rem; }
    .subtitle { color: #64748b; margin-bottom: 1.5rem; }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    button {
      background: #1e293b; color: #38bdf8; border: 1px solid #334155;
      padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer;
      font-size: 0.875rem; transition: background 0.15s;
    }
    button:hover { background: #334155; }
    .input-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr auto;
      gap: 0.5rem; margin-bottom: 1rem;
    }
    input {
      background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
      padding: 0.5rem; border-radius: 0.375rem; font-size: 0.875rem;
    }
    input::placeholder { color: #475569; }
    pre {
      background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem;
      padding: 1rem; overflow-x: auto; font-size: 0.8125rem;
      line-height: 1.6; white-space: pre-wrap; max-height: 400px;
      overflow-y: auto;
    }
    .stat { display: inline-block; background: #1e293b; border: 1px solid #334155;
            border-radius: 0.375rem; padding: 0.375rem 0.75rem; margin-right: 0.5rem;
            font-size: 0.875rem; }
    .stat b { color: #38bdf8; }
    #status { color: #4ade80; font-size: 0.875rem; margin-bottom: 1rem; }
    #error { color: #f87171; font-size: 0.875rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>RDF-WASM Demo</h1>
  <p class="subtitle">RDF Core 1.1 graph library compiled to WebAssembly</p>
  <div id="status">Loading WASM module...</div>
  <div id="error"></div>

  <h2>Add Triple</h2>
  <div class="input-row">
    <input id="inp-s" placeholder="Subject (IRI or _:bnode)">
    <input id="inp-p" placeholder="Predicate (IRI)">
    <input id="inp-o" placeholder="Object (IRI, _:bnode, or literal)">
    <button id="btn-add">Add</button>
  </div>

  <h2>Controls</h2>
  <div class="controls">
    <button id="btn-sample">Load Sample Data</button>
    <button id="btn-ntriples">Show N-Triples</button>
    <button id="btn-json">Show JSON</button>
    <button id="btn-bnodes">List Blank Nodes</button>
    <button id="btn-clear">Clear Output</button>
  </div>

  <h2>Stats</h2>
  <div id="stats"></div>

  <h2>Output</h2>
  <pre id="output">(output appears here)</pre>

  <script type="module">
    import init, { JsRdfGraph } from "../pkg/rdf_wasm.js";

    let graph;

    const $ = id => document.getElementById(id);
    const out = text => { $("output").textContent = text; };
    const err = text => { $("error").textContent = text; setTimeout(() => $("error").textContent = "", 4000); };
    const updateStats = () => {
      $("stats").innerHTML =
        `<span class="stat">Triples: <b>${graph.size}</b></span>` +
        `<span class="stat">Blank nodes: <b>${JSON.parse(graph.bnodes()).length}</b></span>`;
    };

    async function boot() {
      await init();
      graph = new JsRdfGraph();
      $("status").textContent = "WASM loaded — ready!";
      updateStats();
    }

    function loadSample() {
      const EX   = "http://example.org/";
      const FOAF = "http://xmlns.com/foaf/0.1/";
      const RDF  = "http://www.w3.org/1999/02/22-rdf-syntax-ns#";

      graph.addTriple(`${EX}alice`, `${RDF}type`,   `${FOAF}Person`);
      graph.addTriple(`${EX}alice`, `${FOAF}knows`, `${EX}bob`);
      graph.addTriple(`${EX}bob`,   `${RDF}type`,   `${FOAF}Person`);
      graph.addTriple(`${EX}alice`, `${FOAF}name`,  "Alice");
      graph.addTripleLang(`${EX}bob`, `${FOAF}name`, "Bob", "en");
      graph.addTripleLang(`${EX}bob`, `${FOAF}name`, "Roberto", "it");
      graph.addTripleTyped(`${EX}alice`, `${EX}age`, "30",
        "http://www.w3.org/2001/XMLSchema#integer");
      graph.addTriple(`${EX}alice`, `${FOAF}knows`, "_:anon1");
      graph.addTriple("_:anon1", `${FOAF}name`, "Charlie");

      updateStats();
      out(graph.toNTriples());
    }

    $("btn-sample").addEventListener("click", loadSample);
    $("btn-ntriples").addEventListener("click", () => out(graph.toNTriples()));
    $("btn-json").addEventListener("click", () => out(graph.toJSON()));
    $("btn-bnodes").addEventListener("click", () => out(graph.bnodes()));
    $("btn-clear").addEventListener("click", () => out(""));

    $("btn-add").addEventListener("click", () => {
      const s = $("inp-s").value.trim();
      const p = $("inp-p").value.trim();
      const o = $("inp-o").value.trim();
      if (!s || !p || !o) { err("All three fields are required."); return; }
      try {
        graph.addTriple(s, p, o);
        updateStats();
        out(graph.toNTriples());
        $("inp-s").value = ""; $("inp-p").value = ""; $("inp-o").value = "";
      } catch (e) { err(e.message); }
    });

    boot().catch(e => { $("status").textContent = "Failed to load WASM"; err(e.message); });
  </script>
</body>
</html>
